<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2F35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PUNKTLANDUNG</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B2F35; --bg-deep:#072226; --panel:#123E45; --line:#1E5560;
  --tape:#FFD23F; --ink:#10201F; --paper:#F6F1E1; --hit:#FF5A4E; --muted:#8DB5B3; --ok:#8BE28B;
  --r:14px;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg-deep);color:var(--paper);font:400 17px/1.45 Archivo,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
#wrap{max-width:520px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column}
main{flex:1;padding:20px 18px 28px;display:flex;flex-direction:column;gap:18px}

/* Maßband: Timer oben. Das Band zieht sich ein, während die Zeit läuft. */
#tape{height:34px;background:var(--bg-deep);position:sticky;top:env(safe-area-inset-top,0);z-index:5;overflow:hidden;display:none}
#tape.on{display:block}
#tapeBand{height:100%;width:100%;transform-origin:left;background:
  repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 52px),
  repeating-linear-gradient(90deg,rgba(16,32,31,.75) 0 1px,transparent 1px 13px) 0 100%/100% 45% no-repeat,
  var(--tape);border-right:6px solid var(--hit)}
#tapeSec{position:absolute;right:0;top:0;min-width:46px;padding:0 10px;text-align:center;font:800 22px/34px Archivo;font-stretch:70%;color:var(--paper);background:var(--bg-deep)}
#tapeSec:empty{display:none}
#tape.low #tapeBand{background-color:#FF9F43}

h1{font:900 44px/0.95 Archivo;font-stretch:68%;letter-spacing:-.5px}
h2{font:800 24px/1.1 Archivo;font-stretch:80%}
.sub{color:var(--muted);font-size:15px}
.num{font-stretch:66%;font-weight:800;font-variant-numeric:tabular-nums}

.panel{background:var(--panel);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}

.btn{display:block;width:100%;padding:16px;border-radius:var(--r);background:var(--tape);color:var(--ink);font:800 19px/1 Archivo;font-stretch:85%;
  box-shadow:0 4px 0 #B8901A;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #B8901A}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px var(--line);font-weight:600}
.btn.small{width:auto;padding:10px 14px;font-size:15px;box-shadow:0 3px 0 #B8901A}
.link{color:var(--muted);text-decoration:underline;font-size:15px;padding:8px}

input.field{width:100%;padding:15px 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--bg-deep);font-size:18px}
input.field:focus{border-color:var(--tape);outline:0}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.err{color:#FFB3AC;font-size:15px;min-height:22px}

.tabs{display:flex;background:var(--bg-deep);border-radius:var(--r);padding:4px}
.tabs button{flex:1;padding:11px;border-radius:10px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--paper)}

/* Spieler */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:99px;background:var(--bg-deep);font-size:14px;max-width:100%}
.chip .tick{width:16px;font-weight:800;color:var(--ok);text-align:center}
.chip.me{box-shadow:inset 0 0 0 2px var(--c)}
.chip.off{opacity:.45}
.chip b{font-stretch:70%;font-weight:800}
.plist{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--bg-deep);border-left:6px solid var(--c)}
.pl .nm{flex:1;min-width:0;overflow:hidden;font-weight:600}
.pl .nm .title{font-size:11.5px;padding:3px 8px;margin-top:2px}
.pl small{color:var(--muted)}
.pl .gain{color:var(--ok);font-weight:800;font-stretch:70%;min-width:54px;text-align:right}
.pl .gain.zero{color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--tape);color:var(--ink)}
.tag.hit{background:var(--hit);color:#fff}

.code{font:900 64px/1 Archivo;font-stretch:75%;letter-spacing:6px;color:var(--tape);text-align:center}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;background:var(--bg-deep);font-weight:700;font-stretch:80%;color:var(--muted)}
.seg button.on{background:var(--tape);color:var(--ink)}
.seg button[disabled]{cursor:default}
.setting{display:flex;flex-direction:column;gap:6px}

/* Frage */
.cat{font-size:14px;color:var(--muted);display:flex;justify-content:space-between}
.qtext{font:700 27px/1.18 Archivo;font-stretch:88%;text-wrap:balance}
.guess{display:flex;align-items:stretch;border-radius:var(--r);border:3px solid var(--tape);background:var(--bg-deep);overflow:hidden}
.guess input{flex:1;min-width:0;border:0;background:none;padding:14px;font:800 38px/1 Archivo;font-stretch:66%;outline:0}
.guess span{display:grid;place-items:center;padding:0 16px;background:var(--tape);color:var(--ink);font-weight:800;font-stretch:80%}
.preview{font-size:15px;color:var(--muted);min-height:22px}
.locked{text-align:center;padding:26px 16px}
.locked .num{font-size:46px;line-height:1;color:var(--tape)}
.opts{display:grid;gap:10px}
.opt{padding:17px 16px;border-radius:var(--r);background:var(--panel);text-align:left;font-weight:600;font-size:18px;box-shadow:inset 0 0 0 2px var(--line);display:flex;gap:12px;align-items:center}
.opt em{font:800 16px/1 Archivo;font-style:normal;width:28px;height:28px;border-radius:8px;background:var(--bg-deep);display:grid;place-items:center;flex:none}
.opt.mine{box-shadow:inset 0 0 0 3px var(--tape)}
.opt.right{background:#1F5A3A;box-shadow:inset 0 0 0 3px var(--ok)}
.opt.wrong{opacity:.55}
.opt .who{margin-left:auto;display:flex;gap:3px}
.opt .who i{width:16px;height:16px;border-radius:50%;background:var(--c)}

/* Auflösung: Zahlenstrahl als Maßband */
.answer{text-align:center}
.answer .num{font-size:58px;line-height:1;color:var(--hit)}
.answer .num small{font-size:24px;color:var(--paper);font-weight:600}
.ruler{position:relative;height:150px;margin:6px 4px 0}
.ruler .band{position:absolute;left:0;right:0;bottom:34px;height:30px;border-radius:4px;background:
  repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 10%),
  repeating-linear-gradient(90deg,rgba(16,32,31,.7) 0 1px,transparent 1px 2%) 0 100%/100% 50% no-repeat,var(--tape)}
.ruler .truth{position:absolute;bottom:26px;width:4px;height:46px;margin-left:-2px;background:var(--hit);border-radius:2px;transform-origin:bottom}
.ruler .truth::after{content:"";position:absolute;left:-5px;top:-8px;border:7px solid transparent;border-top-color:var(--hit)}
.ruler .pin{position:absolute;bottom:64px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.ruler .pin b{background:var(--c);color:var(--ink);font:800 13px/1 Archivo;padding:4px 6px;border-radius:6px;white-space:nowrap}
.ruler .pin::after{content:"";width:2px;background:var(--c);height:var(--h,10px)}
.ruler .ends{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-26px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.ruler .pin{animation:drop .35s both;animation-delay:calc(var(--i)*.12s)}
.ruler .truth{animation:grow .4s both;animation-delay:var(--d)}
.answer{animation:pop .4s both;animation-delay:var(--d)}
.banner{background:var(--hit);color:#fff;text-align:center;padding:12px;border-radius:var(--r);font:900 24px/1.1 Archivo;font-stretch:75%;animation:pop .5s both;animation-delay:var(--d)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg-deep);border-radius:12px;padding:12px 8px;text-align:center}
.stat .num{font-size:28px;line-height:1;display:block}
.stat span{font-size:12.5px;color:var(--muted)}
.big{font-size:84px;line-height:1;text-align:center;color:var(--tape)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:12px 16px;border-radius:12px;font-weight:600;max-width:90vw;display:none;z-index:9}
/* Profilbild mit Prestige-Rahmen */
.ava{--fc:transparent;position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-block;color:var(--ink);
  font:800 calc(var(--s)*.38)/1 Archivo;font-stretch:75%;box-shadow:0 0 0 calc(var(--s)*.065) var(--fc)}
.ava img,.ava .ini{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--c)}
.ava .emb{position:absolute;right:-24%;bottom:-24%;width:62%;height:62%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
.embimg{width:100%;height:100%;object-fit:contain;display:block;border-radius:0!important;background:none!important}
.ava.t1,.ava.t2{--fc:#C8843C}.ava.t3,.ava.t4{--fc:#C9D3D6}.ava.t5,.ava.t6{--fc:#FFD23F}.ava.t7{--fc:#3DDC97}.ava.t8{--fc:#5AA9FF}.ava.t9{--fc:#FF4D6D}
.ava.t5,.ava.t6,.ava.t7,.ava.t8,.ava.t9,.ava.t10,.ava.t11{box-shadow:0 0 0 calc(var(--s)*.065) var(--fc),0 0 0 calc(var(--s)*.1) var(--bg-deep),0 0 0 calc(var(--s)*.125) var(--fc)}
.ava.t10{--fc:#FF8A00}
.ava.t11{--fc:#FFD23F}
.ava.t10,.ava.t11{animation:avaglow 2.8s ease-in-out infinite alternate}
.ava.t11 .emb{width:60%;height:60%;right:-22%;bottom:-22%}
@keyframes avaglow{from{filter:drop-shadow(0 0 3px rgba(255,150,40,.35))}to{filter:drop-shadow(0 0 12px rgba(255,180,60,.75))}}
@keyframes spin{to{transform:rotate(360deg)}}
.lv{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--bg-deep);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tape);border-radius:99px;transition:width .5s}
.bar.done i{background:var(--ok)}
.pcard{display:flex;gap:16px;align-items:center;width:100%;text-align:left}
.req{display:flex;flex-direction:column;gap:5px}
.req .row{justify-content:space-between;font-size:15px}
.ranks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rank{background:var(--bg-deep);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted);line-height:1.2}
.rank .embimg{width:100%;max-width:60px;height:auto;aspect-ratio:1;margin:0 auto 4px}
.rank.locked .embimg{filter:grayscale(1) brightness(.45)}
.rank.cur{box-shadow:inset 0 0 0 2px var(--tape);color:var(--paper)}
.pips{display:flex;gap:3px}.pips i{width:14px;height:6px;border-radius:3px;background:var(--bg-deep)}.pips i.on{background:var(--tape)}
.chal{display:flex;flex-direction:column;gap:7px;padding:13px 14px;border-radius:var(--r);background:var(--panel)}
.xpbig{font-size:52px;line-height:1;color:var(--tape)}
.parts{font-size:14.5px;color:var(--muted)}.parts div{display:flex;justify-content:space-between;padding:3px 0}
#modal{position:fixed;inset:0;background:rgba(3,15,17,.8);display:none;z-index:8;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:max(20px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
#modal.on{display:flex;align-items:flex-start;justify-content:center}
#modal .panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
@media (min-width:1000px){#modal{padding:32px 20px}#modal .panel{max-width:560px}}
.center{text-align:center}
.crown{color:var(--tape)}

/* ---- Politur: Tiefe, Metall, Licht ---- */
body{background:radial-gradient(120% 80% at 50% -10%,#15505A 0%,#0B2F35 45%,#051A1D 100%) fixed}
#wrap{background:
  radial-gradient(90% 50% at 50% 0%,rgba(255,210,63,.07),transparent 60%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 14px),
  linear-gradient(180deg,#0E3840,#08262B);box-shadow:0 0 80px rgba(0,0,0,.6)}
.panel,.chal{background:linear-gradient(180deg,#19535D 0%,#113E46 100%);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 12px 26px rgba(0,0,0,.35)}
.pl,.stat,.rank,.chip{background:linear-gradient(180deg,#0B2B30,#07201F);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 10px rgba(0,0,0,.25)}
.pl{border-left-width:5px}
.btn{background:linear-gradient(180deg,#FFE88A 0%,#FFD23F 45%,#E8A91C 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 0 #9A7410,0 10px 22px rgba(255,190,40,.22);text-shadow:0 1px 0 rgba(255,255,255,.45)}
.btn:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 0 #9A7410}
.btn.small{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 0 #9A7410}
.btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.12);text-shadow:none}
.btn[disabled]{filter:saturate(.4)}
h1,.code,.xpbig,.big{background:linear-gradient(180deg,#FFF3B8 0%,#FFD23F 48%,#C98A12 52%,#FFE27A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.answer .num{text-shadow:0 0 28px rgba(255,90,78,.55)}
.bar{box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.bar i{background:linear-gradient(180deg,#FFE88A,#F2B92A);box-shadow:0 0 12px rgba(255,210,63,.55)}
.bar.done i{background:linear-gradient(180deg,#B9F5B9,#4FC46A);box-shadow:0 0 12px rgba(139,226,139,.5)}
#tapeBand{box-shadow:inset 0 10px 8px -6px rgba(255,255,255,.45),inset 0 -8px 8px -6px rgba(0,0,0,.35)}
.ruler .band{box-shadow:inset 0 8px 6px -5px rgba(255,255,255,.5),inset 0 -6px 6px -4px rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.4)}
.guess{box-shadow:0 0 0 1px rgba(255,210,63,.25),0 0 26px rgba(255,210,63,.18),inset 0 3px 8px rgba(0,0,0,.5)}
.opt{background:linear-gradient(180deg,#19535D,#113E46);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.1),0 6px 14px rgba(0,0,0,.3)}
.opt.mine{box-shadow:inset 0 0 0 3px var(--tape),0 0 22px rgba(255,210,63,.3)}
.banner{background:linear-gradient(100deg,#FF5A4E 0%,#FF8A3D 40%,#FFD23F 50%,#FF8A3D 60%,#FF5A4E 100%);background-size:250% 100%;animation:pop .5s both,shine 1.6s linear infinite;animation-delay:var(--d),var(--d);box-shadow:0 0 34px rgba(255,120,60,.5);text-shadow:0 2px 0 rgba(0,0,0,.25)}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
.ava{box-shadow:0 0 0 calc(var(--s)*.065) var(--fc),0 4px 10px rgba(0,0,0,.45)}
.logo{width:min(46vw,190px);aspect-ratio:1;display:block;margin:0 auto;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:54px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.wordmark{font-size:31px;line-height:1;letter-spacing:.5px;font-stretch:62%}
.wordmark.big{font-size:46px;text-align:center}
@media (min-width:1000px){.wordmark{font-size:44px}.wordmark.big{font-size:66px}}
.chal{flex-direction:row!important;align-items:center;gap:14px!important}
.chal .ci{width:62px;height:62px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.chal .ci.none{filter:grayscale(1) brightness(.5)}
.chal .cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.trophy{width:min(52vw,210px);aspect-ratio:1;display:block;margin:0 auto -6px;filter:drop-shadow(0 0 34px rgba(255,200,80,.4)) drop-shadow(0 14px 18px rgba(0,0,0,.55));animation:slam .7s cubic-bezier(.2,1.4,.4,1) both}
.banner{display:flex;align-items:center;justify-content:center;gap:10px}.banner img{width:46px;height:46px}
/* Prestige-Moment */
#unlock{position:fixed;inset:0;z-index:20;display:none;place-items:center;text-align:center;background:radial-gradient(circle at 50% 42%,rgba(20,70,80,.96),rgba(3,14,16,.98) 70%);overflow:hidden;padding:24px}
#unlock.on{display:grid}
#unlock .rays{position:absolute;left:50%;top:42%;width:160vmax;height:160vmax;margin:-80vmax;background:repeating-conic-gradient(from 0deg,rgba(255,210,63,.13) 0 8deg,transparent 8deg 20deg);animation:spin 28s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
#unlock .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:420px;width:100%}
#unlock .big-emb{width:min(64vw,260px);aspect-ratio:1;filter:drop-shadow(0 0 40px rgba(255,200,80,.55)) drop-shadow(0 18px 24px rgba(0,0,0,.6));animation:slam .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{0%{transform:scale(3) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:none}}
#unlock h1{font-size:52px;animation:pop .5s .45s both}
#unlock p{animation:pop .5s .6s both}
#unlock .btn{animation:pop .5s .9s both}

/* Spalten: am Handy unsichtbar, am Desktop echte Spalten */
.col{display:contents}
.deskonly{display:none!important}
.fr-dot{width:10px;height:10px;border-radius:50%;background:#56706F;flex:none}.fr-dot.on{background:#8BE28B;box-shadow:0 0 10px #8BE28B}.fr-dot.play{background:var(--tape);box-shadow:0 0 10px var(--tape)}
.mini{padding:7px 10px;border-radius:9px;font-size:13px;font-weight:700;background:var(--bg-deep);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16);white-space:nowrap}
.mini.go{background:var(--tape);color:var(--ink);box-shadow:none}
[data-user]{cursor:pointer}
/* Emotes */
#emotes{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;gap:8px;padding:8px 10px;border-radius:99px;z-index:7;background:rgba(5,26,29,.88);backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.1)}
#emotes.on{display:flex}
#emotes button{font-size:30px;line-height:1;width:48px;height:48px;border-radius:50%;animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.18s);transition:transform .1s}
#emotes button:active{transform:scale(1.35)}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.1)}}
.emo-fly{position:fixed;z-index:9;pointer-events:none;font-size:54px;line-height:1;animation:boom 1.9s cubic-bezier(.2,.9,.3,1) forwards;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.emo-ring{position:fixed;z-index:8;pointer-events:none;width:20px;height:20px;margin:-10px;border-radius:50%;border:4px solid var(--c,#FFD23F);animation:ring .7s ease-out forwards}
.emo-name{position:fixed;z-index:9;pointer-events:none;font:800 13px/1 Archivo;padding:4px 8px;border-radius:8px;background:var(--c,#FFD23F);color:var(--ink);animation:boom 1.9s cubic-bezier(.2,.9,.3,1) forwards}

/* Spielerkarte im CoD-Stil */
.pcard{position:relative;display:flex;align-items:center;gap:12px;padding:14px 14px 18px;min-height:104px;border-radius:18px;overflow:hidden;
  background:linear-gradient(120deg,#0C343B 0%,#17525C 45%,#0A2A30 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 26px rgba(0,0,0,.4)}
.pcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 3px,transparent 3px 22px);pointer-events:none}
.pcard .pcl{display:flex;align-items:center;flex:none;z-index:1}
.pcard .mid{flex:1;min-width:0;z-index:1;display:flex;flex-direction:column;gap:6px}
.pcard .who{display:flex;align-items:center;gap:8px;min-width:0}
.pcard .who b{font:800 21px/1.1 Archivo;font-stretch:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .lvrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pcard .lvrow span:last-child{overflow:hidden;text-overflow:ellipsis}
.pcard .lvrow .bar{flex:1}
.pcard .trow{display:flex;align-items:center;gap:11px}
.pcard .who{padding-left:2px}
.pcard .trow .titleimg{flex:1;min-width:0}
.pcard .trow .pcemb{flex:none}
.pcard .pres img{width:100%;height:100%;object-fit:contain}
.pcard .streak{position:absolute;right:8px;bottom:4px;z-index:2;display:flex;align-items:flex-end;gap:2px}

.pcard .streak img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,140,40,.65));animation:flick 1.1s ease-in-out infinite alternate}
.pcard .streak b{font:800 15px/1 Archivo;font-stretch:70%;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);margin-bottom:6px}
@keyframes flick{from{transform:scaleY(.94) translateY(1px);opacity:.88}to{transform:scaleY(1.06) translateY(-1px);opacity:1}}
/* Prestige 9 und 10 leben */
.pglow{position:relative;display:inline-block;isolation:isolate}
.pglow.p9::before{content:"";position:absolute;inset:-10%;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(255,60,90,.6),transparent 64%);filter:blur(3px);animation:ruby 1.9s ease-in-out infinite;pointer-events:none}
.pglow.p10::before{content:"";position:absolute;inset:-18%;border-radius:50%;z-index:-1;background:radial-gradient(circle at 50% 60%,rgba(255,150,40,.55),rgba(255,70,15,.22) 42%,transparent 70%);filter:blur(6px);animation:blaze 2.6s ease-in-out infinite alternate;pointer-events:none}
.pglow.p10 img,.pglow.p10 .embimg{animation:emberglow 2.6s ease-in-out infinite alternate}
@keyframes emberglow{from{filter:drop-shadow(0 0 4px rgba(255,140,40,.45)) saturate(1.05)}to{filter:drop-shadow(0 0 14px rgba(255,170,60,.9)) saturate(1.25) brightness(1.06)}}
.pglow.p11::before{content:"";position:absolute;inset:-20%;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(255,200,80,.55),rgba(255,120,20,.22) 42%,transparent 70%);filter:blur(7px);animation:masterglow 3s ease-in-out infinite alternate;pointer-events:none}
.pglow.p11 img,.pglow.p11 .embimg{animation:masterpulse 3.2s ease-in-out infinite alternate}
/* Effekte direkt im Emblem: per Maske auf die Form des Bildes begrenzt */
.pglow::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.pglow.p9::after{-webkit-mask-image:url(/emblems/p9.webp?v=${AVER});mask-image:url(/emblems/p9.webp?v=${AVER});
  background:radial-gradient(circle at 50% 52%,rgba(255,255,255,.95),rgba(255,70,110,.75) 22%,rgba(255,40,80,.15) 40%,transparent 60%);
  animation:gemflash 2.4s ease-in-out infinite}
@keyframes gemflash{0%,100%{opacity:.12;transform:scale(.97)}40%{opacity:1;transform:scale(1.03)}55%{opacity:.55}70%{opacity:.85}}
.pglow.p10::after{-webkit-mask-image:url(/emblems/p10.webp?v=${AVER});mask-image:url(/emblems/p10.webp?v=${AVER});
  background:radial-gradient(ellipse 42% 60% at 50% 70%,rgba(255,235,150,.95),rgba(255,150,30,.55) 45%,rgba(255,70,0,.12) 70%,transparent 85%);
  background-size:100% 190%;animation:burn 1.9s ease-in-out infinite alternate;opacity:.75}
@keyframes burn{from{background-position:0 88%;opacity:.45}to{background-position:0 22%;opacity:.95}}
.pglow.p11::after{-webkit-mask-image:url(/emblems/p11.webp?v=${AVER});mask-image:url(/emblems/p11.webp?v=${AVER});
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.1) 45%,rgba(255,245,200,.85) 50%,rgba(255,255,255,.1) 55%,transparent 65%);
  background-size:300% 300%;animation:sheen 3s ease-in-out infinite}
@keyframes sheen{0%{background-position:140% 140%}50%,100%{background-position:-70% -70%}}
@keyframes masterpulse{from{filter:drop-shadow(0 0 5px rgba(255,190,60,.45))}to{filter:drop-shadow(0 0 16px rgba(255,210,90,.95)) brightness(1.07)}}
@keyframes masterglow{from{opacity:.4;transform:scale(.96)}to{opacity:.95;transform:scale(1.06)}}

@keyframes ruby{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
@keyframes blaze{from{opacity:.45;transform:scale(.97)}to{opacity:.95;transform:scale(1.05)}}

<body>
<div id="wrap">
  <div id="tape" aria-hidden="true"><div id="tapeBand"></div><div id="tapeSec"></div></div>
  <main id="app"></main>
</div>
<button id="sound" title="Ton an/aus" aria-label="Ton an oder aus">🔊</button>
<button id="quit" title="Match verlassen" aria-label="Match verlassen">✕</button>
<div id="emotes"></div>
<div id="opener"></div>
<div id="bullsfx"></div>
<div id="unlock"></div>
<div id="modal"></div>
<div id="toast" role="status"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const AVER = '10';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
let token = null; try { token = localStorage.getItem('sz_token'); } catch (e) {}
let S = null, L = { open: [], max: 2, running: 0 }, home = null, socket = null, offset = 0, viewKey = '', authTab = 'login', lastVibe = '', page = 'home', privMode = false, friends = [];

const fmt = (v, unit) => v === null || v === undefined ? '–' : (unit === 'Jahr' ? String(Math.round(v)) : Number(v).toLocaleString('de-DE', { maximumFractionDigits: 3 }));
const initials = (n) => n.trim().slice(0, 2).toUpperCase();
// Eigene Prestige-Embleme (Rang 1-10), als SVG gezeichnet
const PAL = ['#FFD23F', '#FF7A6B', '#4FD1C5', '#C4A5FF', '#8BE28B', '#FFA94D'];
const TIER = ['', '#C8843C', '#C8843C', '#C9D3D6', '#C9D3D6', '#FFD23F', '#FFD23F', '#3DDC97', '#5AA9FF', '#FF4D6D', '#FF8A00'];
function emblem(t) { const i = `<img class="embimg" src="/emblems/p${t}.webp?v=${AVER}" alt="" draggable="false">`; return t >= 9 ? `<span class="pglow p${t}" style="width:100%;height:100%">${i}</span>` : i; }
function avatar(p, size = 40, emb = true) {
  const t = (p.presShown === undefined || p.presShown === null ? p.prestige : p.presShown) || 0;
  const fr = p.frame ? `<img class="frm ${esc(p.frameAnim || '')}" src="/emblems/${esc(p.frame)}.webp?v=${AVER}" alt="">` : '';
  return `<span class="ava t${t} ${p.frame ? 'hasfrm' : ''}" style="--s:${size}px;--c:${p.color || PAL[(p.id || 0) % 6]}">${p.av ? `<img src="/api/avatar/${p.id}?v=${p.av}" alt="">` : `<span class="ini">${esc(initials(p.name))}</span>`}${fr}${t && emb ? `<span class="emb">${emblem(t)}</span>` : ''}</span>`;
}
const flameHtml = (p, size) => (p && p.streak ? `<span class="fl"><img src="/emblems/streak${Math.min(5, p.streak)}.webp?v=${AVER}" style="width:${size || 20}px;height:${size || 20}px" alt=""><b>${Math.min(99, p.streak)}</b></span>` : '');
function streakHtml(p) {
  const n = Math.min(5, p.streak || 0);
  return n ? `<div class="streak"><img src="/emblems/streak${n}.webp?v=${AVER}" alt=""><b>${n}</b></div>` : '';
}
function playerCard(p, extra) {
  const lv = p.max ? 1 : (p.next ? p.into / p.next : 0);
  return `<div class="pcard">
    <div class="mid"><div class="who">${tagHtml(p)}<b>${esc(p.name)}</b></div>
      <div class="trow">${avatar(p, 56)}${p.title ? titleHtml(p) : '<span class="sub grow" style="font-size:13px">Kein Titel</span>'}
        ${p.emblem ? `<img class="pcemb" style="--s:50px" src="/emblems/pc_${esc(p.emblem)}.webp?v=${AVER}" alt="">` : ''}</div>
      <div class="lvrow"><span class="num" style="font-size:16px;color:var(--paper)">Lv ${p.level}</span><span class="bar"><i style="width:${Math.round(lv * 100)}%"></i></span><span>${p.max ? 'max' : p.into + '/' + p.next}</span></div>
      ${extra || ''}</div>
    ${streakHtml(p)}</div>`;
}
const embHtml = (p, size) => (p && p.emblem ? `<img class="pcemb" style="--s:${size || 34}px" src="/emblems/pc_${esc(p.emblem)}.webp?v=${AVER}" alt="">` : '');
const titleHtml = (p, big) => (p && p.title ? `<img class="titleimg${big ? ' big' : ''}" src="/emblems/title_${esc(p.title.id)}.webp?v=${AVER}" alt="${esc(p.title.text)}" title="${esc(p.title.text)}">` : '');
const tagHtml = (p) => (p && p.tag ? `<span class="ctag c-${esc(p.tagColor || 'cyan')}">[${esc(p.tag)}]</span>` : '');
const withTag = (p, name) => tagHtml(p) + esc(name === undefined ? p.name : name);
function seenText(u) {
  if (!u || !u.lastSeen) return 'noch nie online';
  const m = Math.round((Date.now() - u.lastSeen) / 60000);
  if (m < 1) return 'gerade eben';
  if (m < 60) return 'vor ' + m + ' Min.';
  const h = Math.round(m / 60);
  if (h < 24) return 'vor ' + h + ' Std.';
  const d = Math.round(h / 24);
  return d === 1 ? 'gestern' : 'vor ' + d + ' Tagen';
}
const onlineText = (u) => (u.online ? 'online' : 'zuletzt ' + seenText(u));
const rankText = (p) => (p.prestige ? `P${p.prestige} · ` : '') + `Lv ${p.level}`;
function closeModal() { $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
function askPassword(code, wrong) {
  $('#modal').innerHTML = `<form class="panel" id="pwJoin"><h2>Match ${esc(code)} ist geschützt</h2><div><label for="pwJ">Passwort</label><input class="field" id="pwJ" maxlength="20" autocomplete="off"></div><div class="err">${wrong ? 'Das Passwort stimmt nicht.' : ''}</div><button class="btn">Beitreten</button><button type="button" class="btn ghost" id="pwCancel">Abbrechen</button></form>`;
  $('#modal').classList.add('on'); $('#pwJ').focus();
  $('#pwJoin').onsubmit = (e) => { e.preventDefault(); socket.emit('join', { code, password: $('#pwJ').value }); closeModal(); };
  $('#pwCancel').onclick = closeModal;
}
async function uploadAvatar(file) {
  try {
    const img = new Image(); img.src = URL.createObjectURL(file); await img.decode();
    const c = document.createElement('canvas'); c.width = c.height = 160; const m = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 160, 160);
    await api('/api/avatar', { data: c.toDataURL('image/jpeg', 0.82) });
    toast('Profilbild gespeichert'); await loadHome(); viewKey = ''; render();
  } catch (e) { toast(e.message && e.status ? e.message : 'Das Bild ließ sich nicht lesen. Nimm ein JPG oder PNG.'); }
}

// Kleine Synth-Sounds, kein Download nötig
let tagColor = 'cyan', themeSel = null, boardMode = 'points', openFold = '', needCode = false;
const seenSet = () => new Set((home && home.seen) || []);
const freshOf = (list, kind) => { const s2 = seenSet(); return list.filter((x) => x.unlocked && !s2.has(kind + ':' + x.id)); };
function markSeen(ids) { if (!ids.length) return; api('/api/seen', { ids }).then(() => { if (home) home.seen = [...new Set([...(home.seen || []), ...ids])]; }).catch(() => {}); }
let actx = null, master = null, muted = false, vol = 0.7; try { muted = localStorage.getItem('sz_mute') === '1'; const v = parseFloat(localStorage.getItem('sz_vol')); if (v >= 0 && v <= 1) vol = v; } catch (e) {}
function setVol() { if (master) master.gain.value = vol * 1.6; }
function noise(dur, vol, cut) {
  const n = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut || 2000;
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(f).connect(g).connect(master); src.start();
}
function tone(f, t0, dur, type = 'triangle', vol = 0.12) {
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, actx.currentTime + t0); g.gain.linearRampToValueAtTime(vol, actx.currentTime + t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t0 + dur);
  o.connect(g).connect(master); o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + dur + 0.05);
}
function sfx(name) {
  if (muted || !actx) return;
  try {
    if (name === 'tick') tone(880, 0, 0.07, 'square', 0.05);
    if (name === 'question') { tone(523, 0, 0.12); tone(784, 0.1, 0.18); }
    if (name === 'sent') tone(660, 0, 0.1, 'sine');
    if (name === 'emote') { tone(880, 0, 0.06, 'sine', 0.08); tone(1320, 0.05, 0.09, 'sine', 0.07); }
    if (name === 'dart' || name === 'dartbest' || name === 'dartexact') {
      const big = name !== 'dart';
      noise(0.05, big ? 0.22 : 0.13, big ? 2600 : 1800);
      tone(big ? 150 : 190, 0, big ? 0.16 : 0.1, 'sine', big ? 0.22 : 0.13);
      if (name === 'dartexact') [880, 1320, 1760].forEach((f, i) => tone(f, 0.06 + i * 0.06, 0.25, 'triangle', 0.1));
    }
    if (name === 'reveal') { tone(392, 0, 0.15); tone(587, 0.12, 0.25); }
    if (name === 'exact') [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.09, 0.35, 'sawtooth', 0.09));
    if (name === 'win') [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.5, 'triangle', 0.13));
    if (name === 'prestige') { [196, 294, 392, 587, 784, 1175].forEach((f, i) => tone(f, i * 0.11, 0.9, 'sawtooth', 0.08)); tone(98, 0, 1.4, 'sine', 0.2); }
  } catch (e) {}
}
// iOS schaltet Web-Audio beim Stummschalter ab. Ein stiller Dauerton über ein Audio-Element
// setzt die Wiedergabe-Kategorie um, dann kommt der Ton meist trotzdem durch.
let silentEl = null;
function unlockAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.connect(actx.destination); setVol(); } catch (e) {} }
  else if (actx.state === 'suspended') actx.resume();
  if (!silentEl) {
    try {
      silentEl = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
      silentEl.loop = true; silentEl.volume = 0.001; silentEl.setAttribute('playsinline', '');
      silentEl.play().catch(() => {});
    } catch (e) {}
  } else if (silentEl.paused) silentEl.play().catch(() => {});
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') unlockAudio(); });

// "1.233" -> 1233, "2,44" -> 2.44, "1.233,5" -> 1233.5
function parseNum(s) {
  s = s.replace(/[\s']/g, ''); if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (s.includes(',')) s = s.match(/,/g).length > 1 ? s.replace(/,/g, '') : s.replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return /^\d+(\.\d+)?$|^\.\d+$/.test(s) ? Number(s) : NaN;
}

async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({ error: 'Der Server antwortet nicht.' }));
  if (!r.ok) throw Object.assign(new Error(j.error || 'Fehler'), { status: r.status });
  return j;
}

let swReg = null, pushState = 'unknown';
const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushOk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

async function pushInit() {
  if (!pushOk()) { pushState = 'nosupport'; return; }
  try {
    swReg = await navigator.serviceWorker.register('/sw.js');
    const sub = await swReg.pushManager.getSubscription();
    pushState = sub ? 'on' : Notification.permission === 'denied' ? 'denied' : 'off';
    if (sub) api('/api/push/subscribe', { sub: sub.toJSON() }).catch(() => {});
  } catch (e) { pushState = 'nosupport'; }
  pushUI();
}
const b64 = (s) => { const p = '='.repeat((4 - s.length % 4) % 4); const r = (s + p).replace(/-/g, '+').replace(/_/g, '/'); const raw = atob(r); return Uint8Array.from([...raw].map((c) => c.charCodeAt(0))); };
async function pushOn() {
  try {
    if (!swReg) await pushInit();
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { pushState = 'denied'; pushUI(); return toast('Benachrichtigungen wurden abgelehnt.'); }
    const { key } = await api('/api/push/key');
    if (!key) return toast('Der Server hat gerade keinen Schlüssel.');
    const sub = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(key) });
    await api('/api/push/subscribe', { sub: sub.toJSON() });
    pushState = 'on'; pushUI(); toast('Benachrichtigungen sind an.');
  } catch (e) { toast('Hat nicht geklappt: ' + (e.message || 'unbekannt')); }
}
async function pushOff() {
  try {
    const sub = swReg && (await swReg.pushManager.getSubscription());
    if (sub) { await api('/api/push/unsubscribe', { endpoint: sub.endpoint }); await sub.unsubscribe(); }
    pushState = 'off'; pushUI(); toast('Benachrichtigungen sind aus.');
  } catch (e) { toast(e.message); }
}
function pushUI() {
  const el = $('#pushbar'); if (!el) return;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (pushState === 'on') { el.hidden = true; return; }
  if (!pushOk() || (ios && !standalone())) {
    el.hidden = !ios;
    if (ios) el.innerHTML = `<span style="font-size:24px">🔔</span><span class="grow"><b>Einladungen aufs Handy</b>Tippe in Safari auf Teilen, dann „Zum Home-Bildschirm“. Danach kannst du Benachrichtigungen erlauben.</span>`;
    return;
  }
  el.hidden = false;
  el.innerHTML = pushState === 'denied'
    ? `<span style="font-size:24px">🔕</span><span class="grow"><b>Benachrichtigungen blockiert</b>Erlaube sie in den Einstellungen deines Geräts für diese App.</span>`
    : `<span style="font-size:24px">🔔</span><span class="grow"><b>Einladungen aufs Handy</b>Lass dich benachrichtigen, wenn dich jemand herausfordert.</span><button class="btn small" id="pushOn">Aktivieren</button>`;
}

function connect() {
  if (socket) socket.disconnect();
  socket = io({ auth: { token } });
  socket.on('state', (s) => {
    const was = S; S = s;
    if (s) offset = s.now - Date.now();
    if (was && !s) loadHome();
    if (s && s.phase === 'finished' && was && was.phase !== 'finished') loadHome();
    render();
  });
  socket.on('lobbies', (l) => { const ch = l.online !== L.online || l.running !== L.running; L = l; if (!S) { update(); if (ch) { clearTimeout(loadFriends.t); loadFriends.t = setTimeout(loadFriends, 800); } } });
  socket.on('emote', (d) => showEmote(d.id, d.e));
  socket.on('err', toast);
  socket.on('note', (m) => { toast(m); sfx('sent'); });
  socket.on('needpw', (d) => askPassword(d.code, d.wrong));
  socket.on('challenged', (d) => {
    sfx('exact');
    $('#modal').innerHTML = `<div class="panel" style="gap:14px;text-align:center"><h2>⚔ Herausforderung</h2><p>${esc(d.from)} fordert dich heraus.</p><p class="sub">Match ${esc(d.code)}</p><button class="btn" id="fightYes">Annehmen</button><button class="btn ghost" id="pwCancel">Ablehnen</button></div>`;
    $('#modal').classList.add('on');
    $('#fightYes').onclick = () => { socket.emit('join', { code: d.code }); closeModal(); };
    $('#pwCancel').onclick = closeModal;
  });
  socket.on('connect', () => { const j = new URLSearchParams(location.search).get('join'); if (j) { history.replaceState(null, '', '/'); setTimeout(() => { if (!S) socket.emit('join', j); }, 300); } });
  socket.on('connect_error', (e) => { if (e.message === 'auth') logout(); });
}

  if (S.phase === 'lobby') return `<div class="col">

    <div class="center" style="padding-top:4vh"><p class="sub" id="cdLabel">Es geht los in</p><div class="num big" id="bigSec"></div><p id="aiNote" class="sub" style="margin-top:8px"></p>
      <p class="sub" style="margin-top:14px">Freunde können bis zum Start noch beitreten</p><div class="code" style="font-size:44px;margin-top:4px">${esc(S.code)}</div>
      <button class="link" id="share">Einladungslink kopieren</button></div>
    <div id="players" class="plist"></div>
    <div id="cdAct"></div>
    <div id="chatBox"></div>
    <div class="panel sub">Schätzfragen: je näher, desto mehr Punkte (bis 100). Sehr nah dran zählt doppelt, eine Punktlandung dreifach. Wer am nächsten liegt, bekommt 25 extra. Auswahlfragen bringen 100 Punkte.</div>`;

  if (S.phase === 'question') { const q = S.question; return `
    <div id="chips" class="chips mobonly"></div><div class="col">
    <div class="cat"><span>${esc(q.cat)}${q.ai ? ' · frisch generiert' : ''}</span><span>Frage ${S.qIndex} von ${S.qTotal}</span></div>
    <div class="qtext">${esc(q.text)}</div>
    <div id="answerArea">${q.type === 'mc'
      ? `<div class="opts">${q.options.map((o, i) => `<button class="opt" data-i="${i}"><em>${'ABCD'[i]}</em>${esc(o)}</button>`).join('')}</div>`
      : `<form id="guessForm" style="display:flex;flex-direction:column;gap:10px">
          <div class="guess"><input id="guess" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Deine Schätzung">${q.unit ? `<span>${esc(q.unit)}</span>` : ''}</div>

function buildReveal() {
  const q = S.question, R = S.reveal, P = Object.fromEntries(S.players.map((p) => [p.id, p]));
  const head = `<div id="chips" class="chips mobonly"></div><div class="col"><div class="cat"><span>${esc(q.cat)}</span><span>Frage ${S.qIndex} von ${S.qTotal}</span></div><div class="qtext" style="font-size:20px">${esc(q.text)}</div>`;
  const foot = `<button class="link" id="report" style="align-self:center"></button><div class="deskonly" style="flex-direction:column;gap:10px;margin-top:8px"><h2>Punktestand</h2><div class="plist" id="sideboard2"></div></div></div>`;
  const footOnly = () => `<button class="link" id="report" style="align-self:center;margin-top:10px"></button></div>`;
  const me = (id) => (id === S.you ? ' me' : '');

  if (q.type === 'mc') {
    const rows = [...R.results].sort((a, b) => (b.right ? 1 : 0) - (a.right ? 1 : 0));
    const ok = R.results.filter((r) => r.right), mine = R.results.find((r) => r.id === S.you);
    return head + `
    <div class="mcsum ${mine ? (mine.right ? 'good' : 'bad') : ''}">
      <div class="big2">${mine ? (mine.right ? '✅ Richtig' : '❌ Falsch') : 'Nicht geantwortet'}</div>
      <div class="sub" style="margin-top:2px">${esc('ABCD'[R.correctIndex])} · ${esc(q.options[R.correctIndex])}</div>
      <div class="row" style="justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap">${ok.length
        ? ok.map((r) => `<span class="chip" style="--c:${P[r.id]?.color}">${avatar(P[r.id] || { name: '?' }, 20, false)}${esc(P[r.id]?.name || '?')}</span>`).join('')
        : '<span class="sub">Niemand lag richtig.</span>'}</div>
      <p class="sub" style="margin-top:8px">${ok.length} von ${R.results.length} richtig</p>
    </div>
    <div class="opts">${q.options.map((o, i) => { const who = R.results.filter((r) => r.value === i);
      return `<div class="opt ${i === R.correctIndex ? 'right' : 'wrong'}"><em>${'ABCD'[i]}</em>${esc(o)}<span class="who">${who.map((r) => `<i style="--c:${P[r.id]?.color}" title="${esc(P[r.id]?.name || '')}"></i>`).join('')}</span></div>`; }).join('')}</div></div><div class="col side">
      <div class="plist">${rows.map((r) => `<div class="res${me(r.id)}" data-pid="${r.id}" style="--c:${P[r.id]?.color}"><span class="mark">${r.value === null ? '⏳' : r.right ? '✅' : '❌'}</span>${avatar(P[r.id] || { name: '?' }, 34, false)}<span class="nm">${P[r.id] ? withTag(P[r.id]) : '?'}${r.id === S.you ? ' <small>(du)</small>' : ''}<br><span class="diff">${r.value === null ? 'keine Antwort' : 'ABCD'[r.value] + ' · ' + esc(q.options[r.value])}</span></span><span class="pts ${r.points ? '' : 'zero'}">+${r.points}</span></div>`).join('')}</div>` + foot;
  }

  const given = R.results.filter((r) => r.value !== null);
  const U = R.unit === 'Jahr' ? '' : ' ' + R.unit;
  const diffText = (r) => r.value === null ? 'keine Schätzung' : r.exact ? 'genau richtig' : `${fmt(Math.abs(r.value - R.answer), R.unit)}${U} ${r.value > R.answer ? 'zu hoch' : 'zu niedrig'}`;
  // Treffergenauigkeit als Balken: 100 % = exakt
  const worstDev = Math.max(...given.map((r) => Math.abs(r.value - R.answer)), 1e-9);
  const acc = (r) => (r.value === null ? 0 : Math.round(100 * (1 - Math.abs(r.value - R.answer) / (worstDev * 1.15))));
  const rows = [...R.results];
  const medal = ['🥇', '🥈', '🥉'];
  const steps = rows.length;
  return head + `
    <div class="answer" style="--d:.1s"><p class="sub">Richtig ist</p><div class="num">${fmt(R.answer, R.unit)} <small>${esc(R.unit === 'Jahr' ? '' : R.unit)}</small></div></div>
    <div class="stairs">${rows.map((r, i2) => {
      const p2 = P[r.id] || { name: '?' };
      const d = ((steps - 1 - i2) * 0.35).toFixed(2) + 's';
      return `<div class="step ${r.id === S.you ? 'me' : ''} ${i2 === 0 && r.value !== null ? 'first' : ''}" style="--c:${p2.color || 'var(--line)'};--d:${d};--in:${Math.min(i2, 4) * 8}px">
        <span class="rk">${r.value === null ? '–' : (medal[i2] || i2 + 1)}</span>
        ${avatar(p2, 40)}
        <span class="nm"><span class="ln1">${withTag(p2)}${r.id === S.you ? '<small>(du)</small>' : ''}${r.exact ? '<span class="tag hit">×3</span>' : r.close ? '<span class="tag">×2</span>' : ''}</span>
          <span class="bar"><i style="width:${Math.max(0, acc(r))}%"></i></span>
          <span class="diff">${diffText(r)}</span></span>
        <span class="val">${r.value === null ? '–' : fmt(r.value, R.unit)}</span>
        <span class="pts ${r.points ? '' : 'zero'}">+${r.points}</span></div>`; }).join('')}</div>
    ${given.length ? `<div class="winbox" style="animation-delay:${((steps - 1) * 0.35 + 0.25).toFixed(2)}s"><img class="frame" src="/emblems/winbanner.webp?v=${AVER}" alt="">
      <div class="in">${avatar(P[rows[0].id] || { name: '?' }, 38)}<b>${esc(P[rows[0].id]?.name || '?')}</b><span class="pts">+${rows[0].points}</span></div>
      ${rows[0].exact ? `<img class="bulls" src="/emblems/bullseye.webp?v=${AVER}" alt="">` : ''}</div>` : ''}
    </div><div class="col side deskonly"><h2>Punktestand</h2><div class="plist" id="sideboard"></div></div>` + footOnly();
}

function friendsHtml() {

  const order = { in: 0, ok: 1, out: 2 };
  return [...friends].sort((a, b) => order[a.status] - order[b.status] || b.online - a.online || a.name.localeCompare(b.name)).map((f) => `<div class="pl" style="--c:${f.status === 'in' ? 'var(--tape)' : 'var(--line)'}" ${f.status === 'ok' ? `data-user="${f.id}"` : ''}>${avatar(f, 38)}<span class="nm">${withTag(f)}<br><span class="lv">${f.status === 'in' ? 'möchte dein Freund sein' : f.status === 'out' ? 'Anfrage gesendet' : rankText(f) + ' · ' + (f.playing ? 'spielt gerade' : onlineText(f))}</span></span>${f.status === 'in' ? `<button class="mini go" data-fr="accept" data-id="${f.id}">Annehmen</button><button class="mini" data-fr="decline" data-id="${f.id}">Nein</button>` : f.status === 'out' ? `<button class="mini" data-fr="remove" data-id="${f.id}">Zurückziehen</button>` : (f.joinCode ? `<button class="mini go" data-join="${esc(f.joinCode)}">Beitreten</button>` : '') + `<span class="fr-dot ${f.playing ? 'play' : f.online ? 'on' : ''}"></span>`}</div>`).join('');
}

const EMOJIS = ['😂', '👍', '👎', '😡', '🔥', '😱'];
function showEmote(pid, i) {
  const els = [...document.querySelectorAll(`[data-pid="${pid}"]`)].filter((e) => e.offsetParent !== null);
  const el = els.find((e) => e.classList.contains('pl')) || els[0]; const p = S && S.players.find((x) => x.id === pid);
  let x = innerWidth / 2, y = innerHeight / 2;
  if (el) { const r = el.getBoundingClientRect(); x = Math.min(innerWidth - 50, Math.max(50, r.left + r.width * 0.72)); y = Math.min(innerHeight - 60, Math.max(70, r.top + r.height / 2)); }
  const mk = (cls, txt) => { const d = document.createElement('div'); d.className = cls; d.textContent = txt || ''; d.style.left = x + 'px'; d.style.top = y + 'px'; if (p) d.style.setProperty('--c', p.color); document.body.appendChild(d); setTimeout(() => d.remove(), 2000); return d; };
  mk('emo-ring'); mk('emo-fly', EMOJIS[i]); if (p && !el) { const n = mk('emo-name', p.name); n.style.top = y + 52 + 'px'; }
  if (el) { el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.04)' }, { transform: 'scale(1)' }], { duration: 300 }); }

      // je Dart ein Einschlag, im Takt der Animation
      const n = S.reveal.results.length;
      S.reveal.results.forEach((r, k) => setTimeout(() => sfx(r.exact ? 'dartexact' : k === 0 ? 'dartbest' : 'dart'), (n - 1 - k) * 350));
      const ex = given.some((r) => r.exact);
      setTimeout(() => {
        if (ex) {
          sfx('exact'); try { navigator.vibrate && navigator.vibrate([60, 40, 200]); } catch (e) {}
          const who = S.reveal.results.filter((r) => r.exact).map((r) => (S.players.find((p) => p.id === r.id) || {}).name || '?');
          showBulls(who.join(' & ') + (who.length > 1 ? ' treffen' : ' trifft') + ' genau');
        } else sfx('reveal');
      }, (n - 1) * 350 + 300);
    } else sfx(S.reveal.results.some((r) => r.right && r.id === S.you) ? 'reveal' : 'sent');
  }
  if (S.phase === 'finished' && lastVibe !== 'f' + S.code) { lastVibe = 'f' + S.code; if (S.winners.includes(S.you)) sfx('win'); }
  if (S.phase === 'reveal' && $('#report')) { $('#report').textContent = S.reported ? 'Frage gemeldet. Danke.' : 'Antwort falsch? Frage melden'; $('#report').disabled = S.reported; }
  if (S.phase === 'finished' && S.summary && !$('#xpSum').innerHTML) { const x = S.summary;
    $('#xpSum').innerHTML = `<div class="panel" style="display:flex;flex-direction:column;gap:10px"><div class="row"><div class="grow"><p class="sub">Dein Fortschritt</p><b class="num xpbig">+${fmt(x.gained)} XP</b></div><div class="center"><span class="sub">Level</span><br><b class="num" style="font-size:30px">${x.levelBefore === x.levelAfter ? x.levelAfter : x.levelBefore + ' → ' + x.levelAfter}</b></div></div>
      <div class="parts">${x.parts.map(([l, v]) => `<div><span>${esc(l)}</span><span>+${fmt(v)}</span></div>`).join('')}</div>${x.rankGain ? `<div class="row" style="justify-content:space-between;padding-top:8px;border-top:1px solid rgba(255,255,255,.12)"><b>Weltrangliste</b><span class="wp">+${fmt(x.rankGain)} WP · ${fmt(x.rankTotal)} gesamt</span></div>` : ''}${x.diamonds ? `<div class="row" style="justify-content:space-between;padding-top:8px;border-top:1px solid rgba(255,255,255,.12)"><b>Diamanten</b><span class="dia"><img src="/tcg/diamond.webp?v=${AVER}" alt="">+${fmt(x.diamonds)}</span></div>` : ''}${x.unlocked && x.unlocked.length ? `<div class="unlocks"><b>Freigeschaltet</b>${x.unlocked.map((u2) => `<span class="uitem">${esc(u2.name)}${u2.xp ? ` <small>+${fmt(u2.xp)} XP</small>` : ''}</span>`).join('')}</div>` : ''}${x.canPrestige ? '<p><span class="tag hit">Prestige bereit</span> Aktiviere den nächsten Rang in deinem Profil.</p>' : ''}</div>`; }
  if (S.phase === 'finished') $('#endAct').innerHTML = (host ? '<button class="btn" id="again">Nochmal spielen</button>' : '<p class="sub center">Der Host kann eine neue Runde starten.</p>') + '<button class="btn ghost" id="leave">Zur Startseite</button>';
}

// ---------- Eingaben ----------
function bind() {
  const form = $('#authForm');
  if (form) form.onsubmit = async (e) => {
    e.preventDefault(); $('#authErr').textContent = '';
    try { const r = await api('/api/' + authTab, { name: $('#fName').value, password: $('#fPass').value, code: $('#fCode') ? $('#fCode').value : undefined });
      token = r.token; try { localStorage.setItem('sz_token', token); } catch (e2) {} viewKey = ''; render(); loadHome(); connect(); pushInit();
    } catch (err) { $('#authErr').textContent = err.message; }
  };
  const vs = $('#volume'); if (vs) { vs.oninput = () => { vol = vs.value / 100; setVol(); try { localStorage.setItem('sz_vol', String(vol)); } catch (e) {} }; vs.onchange = () => sfx('reveal'); }
  const af = $('#avaFile'); if (af) af.onchange = () => af.files[0] && uploadAvatar(af.files[0]);
  const pf = $('#pwForm'); if (pf) pf.onsubmit = (e) => { e.preventDefault(); const v = $('#pwInput').value.trim(); if (!v) return toast('Gib ein Passwort ein oder stelle auf Öffentlich.'); socket.emit('settings', { password: v }); $('#pwInput').blur(); toast('Passwort gespeichert'); };
  const jf = $('#joinForm'); if (jf) jf.onsubmit = (e) => { e.preventDefault(); const c = $('#joinCode').value.trim(); if (c.length === 4) socket.emit('join', c); else toast('Der Code hat 4 Buchstaben.'); };
  const gf = $('#guessForm');
  if (gf) { const inp = $('#guess'); setTimeout(() => inp.focus(), 50);
    inp.oninput = () => { const v = parseNum(inp.value); $('#send').disabled = !Number.isFinite(v); $('#preview').textContent = Number.isFinite(v) ? `Wird gewertet als ${fmt(v, S.question.unit)} ${S.question.unit === 'Jahr' ? '' : S.question.unit}` : inp.value ? 'Bitte nur eine Zahl eingeben.' : ''; };
    gf.onsubmit = (e) => { e.preventDefault(); const v = parseNum(inp.value); if (Number.isFinite(v)) { socket.emit('answer', v); sfx('sent'); } };
  }
}
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'castForm') return; e.preventDefault();
  api('/api/admin/broadcast', { title: $('#castTitle').value || 'PUNKTLANDUNG', body: $('#castBody').value })
    .then((r) => { toast('An ' + r.sent + ' Geräte geschickt'); $('#castBody').value = ''; }).catch((er) => toast(er.message));
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'modSearch') return; e.preventDefault(); modLoad($('#modQ').value);
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'codeForm') return; e.preventDefault();
  api('/api/redeem', { code: $('#codeIn').value }).then(async (r) => { toast('Freigeschaltet: ' + r.reward); $('#codeIn').value = ''; await loadHome(); viewKey = ''; render(); }).catch((er) => toast(er.message));
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'chatForm') return; e.preventDefault();
  const i = $('#chatIn'); if (i.value.trim()) { socket.emit('chat', i.value); i.value = ''; }
});
document.addEventListener('submit', (e) => {
  if (!e.target.classList.contains('frForm')) return; e.preventDefault(); const inp = e.target.querySelector('input'); if (!inp.value.trim()) return;
  api('/api/friends/add', { name: inp.value }).then((r) => { toast(r.status === 'ok' ? r.name + ' ist jetzt dein Freund' : 'Anfrage an ' + r.name + ' gesendet'); inp.value = ''; loadFriends(); }).catch((er) => toast(er.message));
});
document.addEventListener('submit', (e) => { if (e.target.id !== 'adminForm') return; e.preventDefault(); api('/api/admin/reset', { name: $('#adName').value, password: $('#adPass').value }).then((r) => { toast('Neues Passwort für ' + r.name + ' gesetzt'); e.target.reset(); }).catch((er) => toast(er.message)); });
document.addEventListener('toggle', (e) => {
  const d = e.target.closest && e.target.closest('.fold');
  if (!d) return;
  if (d.open) {
    openFold = d.dataset.fold; document.querySelectorAll('.fold[open]').forEach((o) => { if (o !== d) o.open = false; });
    const C2 = home && home.cards;
    if (C2) {
      const ids = d.dataset.fold === 'emb' ? freshOf(C2.emblems, 'e').map((x) => 'e:' + x.id)
        : d.dataset.fold === 'tit' ? freshOf(C2.titles, 't').map((x) => 't:' + x.id)
        : freshOf(home.frames || [], 'f').map((x) => 'f:' + x.id);
      markSeen(ids);
      d.querySelectorAll('.fresh').forEach((x) => x.classList.remove('fresh'));
      const b = d.querySelector('summary .badge'); if (b) b.remove();
    }
    setTimeout(() => d.scrollIntoView({ block: 'start', behavior: 'smooth' }), 60);
  }
  else if (openFold === d.dataset.fold) openFold = '';
}, true);
document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) { const pr = e.target.closest('[data-pres]'); if (pr) { api('/api/prestige-icon', { n: Number(pr.dataset.pres) }).then(async () => { await loadHome(); viewKey = ''; render(); }).catch((er) => toast(er.message)); return; }
    const u = e.target.closest('[data-user]'); if (u) showUser(u.dataset.user); const m = e.target.closest('[data-mod]'); if (m) modEdit(m.dataset.mod, ''); return; }
  if (t.closest('[data-mod]')) return modEdit(t.closest('[data-mod]').dataset.mod, '');
  if (t.dataset.dia) {
    const cur = Number($('#modDia').value) || 0;
    const v = t.dataset.dia === 'add' ? cur + 500 : t.dataset.dia === 'sub' ? Math.max(0, cur - 500) : cur;
    $('#modDia').value = v;
    return api('/api/admin/diamonds', { id: modOpen, diamonds: v }).then(() => { toast('Diamanten: ' + v); modLoad($('#modQ') ? $('#modQ').value : ''); }).catch((er) => toast(er.message));
  }
  if (t.dataset.role !== undefined) { document.querySelectorAll('#modRole .chipbtn').forEach((b) => b.classList.toggle('on', b === t)); return; }
  if (t.dataset.mu !== undefined) {
    const uid = modOpen; const on = t.dataset.on !== undefined ? t.dataset.on === '1' : !t.classList.contains('on');
    return api('/api/admin/unlock', { id: uid, card: t.dataset.mu, on }).then((res) => { modUsers = modUsers.map((x) => x.id === res.user.id ? res.user : x); modEdit(uid, 'cards'); }).catch((er) => toast(er.message));
  }
  if (t.dataset.emote !== undefined) return socket.emit('emote', Number(t.dataset.emote));
  if (t.dataset.addfriend) return api('/api/friends/add', { name: t.dataset.addfriend }).then((r) => { toast(r.status === 'ok' ? r.name + ' ist jetzt dein Freund' : 'Anfrage an ' + r.name + ' gesendet'); t.remove(); loadFriends(); }).catch((er) => toast(er.message));
  if (t.dataset.fr) return api('/api/friends/' + t.dataset.fr, { id: Number(t.dataset.id) }).then(() => { closeModal(); loadFriends(); }).catch((er) => toast(er.message));
  if (t.dataset.tab) { authTab = t.dataset.tab; render(); }
  else if (t.dataset.join) socket.emit('join', t.dataset.join);
  else if (t.dataset.set) socket.emit('settings', { [t.dataset.set]: Number(t.dataset.v) });
  else if (t.dataset.mode) socket.emit('settings', { ranked: t.dataset.mode === 'ranked' });
  else if (t.dataset.theme) {
    if (!themeSel) themeSel = [...S.themes];
    if (t.dataset.theme === 'grace') { themeSel = ['grace']; return socket.emit('settings', { themes: ['grace'] }); }
    if (themeSel.includes('grace')) themeSel = [];
    const has = themeSel.includes(t.dataset.theme);
    if (!has && themeSel.length >= S.maxThemes) return toast(`Höchstens ${S.maxThemes} Themen.`);
    if (has && themeSel.length === 1) return toast('Mindestens ein Thema muss aktiv bleiben.');
    if (!has && themeSel.length === 0) { themeSel = [t.dataset.theme]; return socket.emit('settings', { themes: themeSel }); }
    themeSel = has ? themeSel.filter((x) => x !== t.dataset.theme) : [...themeSel, t.dataset.theme];
    t.classList.toggle('on', !has);
    socket.emit('settings', { themes: themeSel });
  }
  else if (t.dataset.i !== undefined && S && S.phase === 'question') socket.emit('answer', Number(t.dataset.i));
  else if (['create', 'start', 'skip', 'again', 'report'].includes(t.id)) socket.emit(t.id);
  else if (t.id === 'createDone') socket.emit('create_done');
  else if (t.id === 'leave' || t.id === 'quit') {
    const midGame = S.phase === 'question' || S.phase === 'reveal';
    if (!midGame || confirm('Match wirklich verlassen? Du bekommst für dieses Match keine XP und keine Weltranglistenpunkte.')) socket.emit('leave');
  }
  else if (t.id === 'logout') logout();
  else if (t.id === 'mute' || t.id === 'sound') { muted = !muted; try { localStorage.setItem('sz_mute', muted ? '1' : '0'); } catch (e2) {} update(); if (!muted) sfx('sent'); }
  else if (t.dataset.board) { boardMode = t.dataset.board; update(); }
  else if (t.dataset.fight) {
    socket.emit('challenge', Number(t.dataset.fight));
    if (t.classList.contains('mini')) { t.textContent = 'gesendet ✓'; t.disabled = true; t.classList.add('sent'); }
    else toast('Einladung wird verschickt …');
  }
  else if (t.id === 'invite') showInvite();
  else if (t.id === 'pushOn') pushOn();
  else if (t.id === 'pushOff') pushOff();
  else if (t.id === 'newTrade') tradeDialog();
  else if (t.id === 'openCards') { page = 'cards'; ctab = 'sammlung'; render(); loadTcg(); }
  else if (t.dataset.ct) { ctab = t.dataset.ct; market = null; trades = null; renderCards(); if (ctab === 'boerse') loadMarket(); if (ctab === 'tausch') loadTrades(); }
  else if (t.dataset.buy) api('/api/tcg/buy', { pack: t.dataset.buy, n: 1 }).then((st) => { tcg = st; if (home) home.me.diamonds = st.diamonds; renderCards(); toast('Booster gekauft'); }).catch((e) => toast(e.message));
  else if (t.dataset.open) openPack(t.dataset.open);
  else if (t.dataset.sell) sellCard(t.dataset.sell);
  else if (t.dataset.mbuy) api('/api/tcg/market/buy', { id: t.dataset.mbuy }).then((st) => { tcg = st; if (home) home.me.diamonds = st.diamonds; loadMarket(); toast('Gekauft'); }).catch((e) => toast(e.message));
  else if (t.dataset.mcancel) api('/api/tcg/cancel', { id: t.dataset.mcancel }).then((st) => { tcg = st; loadMarket(); }).catch((e) => toast(e.message));
  else if (t.dataset.tacc) api('/api/tcg/trade/accept', { id: t.dataset.tacc }).then(() => { loadTrades(); loadTcg(); toast('Getauscht'); }).catch((e) => toast(e.message));
  else if (t.dataset.tdec) api('/api/tcg/trade/decline', { id: t.dataset.tdec }).then(() => loadTrades()).catch((e) => toast(e.message));
  else if (t.id === 'closeOpener') { $('#opener').classList.remove('on'); loadTcg(); }
  else if (t.id === 'openProfile') { page = 'profile'; render(); }
  else if (t.id === 'back') { page = 'home'; render(); }
  else if (t.id === 'avaBtn') $('#avaFile').click();
  else if (t.dataset.frame !== undefined) {
    if (t.classList.contains('lock')) return toast(t.title || 'Noch nicht freigeschaltet.');
    api('/api/frame', { frame: t.dataset.frame }).then(async () => { await loadHome(); viewKey = ''; render(); }).catch((e) => toast(e.message));
  }
  else if (t.dataset.emb !== undefined || t.dataset.title !== undefined) {
    if (t.classList.contains('lock')) return toast(t.title || 'Noch nicht freigeschaltet.');
    const me = home.me, cur = t.dataset.emb !== undefined ? me.emblem : (me.title || '');
    const val = (t.dataset.emb !== undefined ? t.dataset.emb : t.dataset.title) === cur ? '' : (t.dataset.emb !== undefined ? t.dataset.emb : t.dataset.title);
    const body = t.dataset.emb !== undefined ? { emblem: val, title: me.title || '' } : { emblem: me.emblem || '', title: val };
    api('/api/card', body).then(async () => { await loadHome(); viewKey = ''; render(); }).catch((e) => toast(e.message));
  }
  else if (t.id === 'cardClear') api('/api/card', { emblem: '', title: '' }).then(async () => { await loadHome(); viewKey = ''; render(); }).catch((e) => toast(e.message));
  else if (t.dataset.color) { tagColor = t.dataset.color; document.querySelectorAll('[data-color]').forEach((b) => b.classList.toggle('on', b === t)); $('#tagIn').dispatchEvent(new Event('input')); }
  else if (t.id === 'waitOn') socket.emit('settings', { waitAi: true });
  else if (t.id === 'waitOff') socket.emit('settings', { waitAi: false });
  else if (t.id === 'accPub') { privMode = false; socket.emit('settings', { password: '' }); }
  else if (t.id === 'accPriv') { privMode = true; update(); $('#pwInput').focus(); }
  else if (t.id === 'doPrestige') { if (confirm('Prestige aktivieren? Level und XP starten wieder bei 1.')) api('/api/prestige', {}).then(async (r) => { await loadHome(); showUnlock(r.prestige, home.progress.names[r.prestige]); }).catch((e) => toast(e.message)); }
  else if (t.id === 'share') { const url = location.origin + '/?join=' + S.code; (navigator.share ? navigator.share({ title: 'Schätzspiel', text: 'Spiel mit! Code ' + S.code, url }) : navigator.clipboard.writeText(url).then(() => toast('Link kopiert'))).catch(() => {}); }
});

// ---------- Maßband-Timer ----------
function tick() {
  if (S && S.phase === 'countdown' && !S.endsAt) { const b = $('#bigSec'); if (b) b.textContent = '…'; const l = $('#cdLabel'); if (l) l.textContent = 'Fragen werden fertig gemacht'; }
  const tape = $('#tape'), on = S && S.endsAt && S.phase !== 'finished' && S.phase !== 'lobby';
  tape.classList.toggle('on', !!on);
  if (on) {
    const left = Math.max(0, S.endsAt - (Date.now() + offset)), sec = Math.ceil(left / 1000);
    $('#tapeBand').style.width = Math.max(0, Math.min(100, 100 * left / (S.totalMs || 1))) + '%';
    $('#tapeSec').textContent = S.phase === 'reveal' ? '' : sec;
    tape.classList.toggle('low', S.phase === 'question' && sec <= 5);
    if (S.phase === 'question' && sec <= 5 && sec > 0 && tick.last !== S.qIndex + ':' + sec) { tick.last = S.qIndex + ':' + sec; if (S.myAnswer === null) sfx('tick'); }
    const big = $('#bigSec'); if (big) big.textContent = sec;
  }
  requestAnimationFrame(tick);
}

let wake = null;
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible') { if (socket && !socket.connected) socket.connect(); try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {} } });
// Beim Laden darf kein Feld den Fokus haben, sonst springt die Tastatur auf
window.addEventListener('pageshow', () => { const a = document.activeElement; if (a && /INPUT|TEXTAREA/.test(a.tagName)) a.blur(); });
setTimeout(() => { const a = document.activeElement; if (a && /INPUT|TEXTAREA/.test(a.tagName)) a.blur(); }, 0);
fetch('/api/config').then((r) => r.json()).then((c) => { if (c.needCode !== needCode) { needCode = c.needCode; if (!token) { viewKey = ''; render(); } } }).catch(() => {});
render(); tick();
if (token) { loadHome(); connect(); pushInit(); }
</script>
