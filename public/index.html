<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2F35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PUNKTLANDUNG</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B2F35; --bg-deep:#072226; --panel:#123E45; --line:#1E5560;
  --tape:#FFD23F; --ink:#10201F; --paper:#F6F1E1; --hit:#FF5A4E; --muted:#8DB5B3; --ok:#8BE28B;
  --r:14px;
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg-deep);color:var(--paper);font:400 17px/1.45 Archivo,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
#wrap{max-width:520px;margin:0 auto;min-height:100%;background:var(--bg);display:flex;flex-direction:column}
main{flex:1;padding:20px 18px 28px;display:flex;flex-direction:column;gap:18px}

/* Maßband: Timer oben. Das Band zieht sich ein, während die Zeit läuft. */
#tape{height:34px;background:var(--bg-deep);position:sticky;top:env(safe-area-inset-top,0);z-index:5;overflow:hidden;display:none}
#tape.on{display:block}
#tapeBand{height:100%;width:100%;transform-origin:left;background:
  repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 52px),
  repeating-linear-gradient(90deg,rgba(16,32,31,.75) 0 1px,transparent 1px 13px) 0 100%/100% 45% no-repeat,
  var(--tape);border-right:6px solid var(--hit)}
#tapeSec{position:absolute;right:0;top:0;min-width:46px;padding:0 10px;text-align:center;font:800 22px/34px Archivo;font-stretch:70%;color:var(--paper);background:var(--bg-deep)}
#tapeSec:empty{display:none}
#tape.low #tapeBand{background-color:#FF9F43}

h1{font:900 44px/0.95 Archivo;font-stretch:68%;letter-spacing:-.5px}
h2{font:800 24px/1.1 Archivo;font-stretch:80%}
.sub{color:var(--muted);font-size:15px}
.num{font-stretch:66%;font-weight:800;font-variant-numeric:tabular-nums}

.panel{background:var(--panel);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}

.btn{display:block;width:100%;padding:16px;border-radius:var(--r);background:var(--tape);color:var(--ink);font:800 19px/1 Archivo;font-stretch:85%;
  box-shadow:0 4px 0 #B8901A;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #B8901A}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px var(--line);font-weight:600}
.btn.small{width:auto;padding:10px 14px;font-size:15px;box-shadow:0 3px 0 #B8901A}
.link{color:var(--muted);text-decoration:underline;font-size:15px;padding:8px}

input.field{width:100%;padding:15px 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--bg-deep);font-size:18px}
input.field:focus{border-color:var(--tape);outline:0}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.err{color:#FFB3AC;font-size:15px;min-height:22px}

.tabs{display:flex;background:var(--bg-deep);border-radius:var(--r);padding:4px}
.tabs button{flex:1;padding:11px;border-radius:10px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--paper)}

/* Spieler */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:99px;background:var(--bg-deep);font-size:14px;max-width:100%}
.chip .tick{width:16px;font-weight:800;color:var(--ok);text-align:center}
.chip.me{box-shadow:inset 0 0 0 2px var(--c)}
.chip.off{opacity:.45}
.chip b{font-stretch:70%;font-weight:800}
.plist{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--bg-deep);border-left:6px solid var(--c)}
.pl .nm{flex:1;min-width:0;overflow:hidden;font-weight:600}
.pl .nm .title{font-size:11.5px;padding:3px 8px;margin-top:2px}
.pl small{color:var(--muted)}
.pl .gain{color:var(--ok);font-weight:800;font-stretch:70%;min-width:54px;text-align:right}
.pl .gain.zero{color:var(--muted)}
.tag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--tape);color:var(--ink)}
.tag.hit{background:var(--hit);color:#fff}

.code{font:900 64px/1 Archivo;font-stretch:75%;letter-spacing:6px;color:var(--tape);text-align:center}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 4px;border-radius:10px;background:var(--bg-deep);font-weight:700;font-stretch:80%;color:var(--muted)}
.seg button.on{background:var(--tape);color:var(--ink)}
.seg button[disabled]{cursor:default}
.setting{display:flex;flex-direction:column;gap:6px}

/* Frage */
.cat{font-size:14px;color:var(--muted);display:flex;justify-content:space-between}
.qtext{font:700 27px/1.18 Archivo;font-stretch:88%;text-wrap:balance}
.guess{display:flex;align-items:stretch;border-radius:var(--r);border:3px solid var(--tape);background:var(--bg-deep);overflow:hidden}
.guess input{flex:1;min-width:0;border:0;background:none;padding:14px;font:800 38px/1 Archivo;font-stretch:66%;outline:0}
.guess span{display:grid;place-items:center;padding:0 16px;background:var(--tape);color:var(--ink);font-weight:800;font-stretch:80%}
.preview{font-size:15px;color:var(--muted);min-height:22px}
.locked{text-align:center;padding:26px 16px}
.locked .num{font-size:46px;line-height:1;color:var(--tape)}
.opts{display:grid;gap:10px}
.opt{padding:17px 16px;border-radius:var(--r);background:var(--panel);text-align:left;font-weight:600;font-size:18px;box-shadow:inset 0 0 0 2px var(--line);display:flex;gap:12px;align-items:center}
.opt em{font:800 16px/1 Archivo;font-style:normal;width:28px;height:28px;border-radius:8px;background:var(--bg-deep);display:grid;place-items:center;flex:none}
.opt.mine{box-shadow:inset 0 0 0 3px var(--tape)}
.opt.right{background:#1F5A3A;box-shadow:inset 0 0 0 3px var(--ok)}
.opt.wrong{opacity:.55}
.opt .who{margin-left:auto;display:flex;gap:3px}
.opt .who i{width:16px;height:16px;border-radius:50%;background:var(--c)}

/* Auflösung: Zahlenstrahl als Maßband */
.answer{text-align:center}
.answer .num{font-size:58px;line-height:1;color:var(--hit)}
.answer .num small{font-size:24px;color:var(--paper);font-weight:600}
.ruler{position:relative;height:150px;margin:6px 4px 0}
.ruler .band{position:absolute;left:0;right:0;bottom:34px;height:30px;border-radius:4px;background:
  repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 10%),
  repeating-linear-gradient(90deg,rgba(16,32,31,.7) 0 1px,transparent 1px 2%) 0 100%/100% 50% no-repeat,var(--tape)}
.ruler .truth{position:absolute;bottom:26px;width:4px;height:46px;margin-left:-2px;background:var(--hit);border-radius:2px;transform-origin:bottom}
.ruler .truth::after{content:"";position:absolute;left:-5px;top:-8px;border:7px solid transparent;border-top-color:var(--hit)}
.ruler .pin{position:absolute;bottom:64px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.ruler .pin b{background:var(--c);color:var(--ink);font:800 13px/1 Archivo;padding:4px 6px;border-radius:6px;white-space:nowrap}
.ruler .pin::after{content:"";width:2px;background:var(--c);height:var(--h,10px)}
.ruler .ends{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-26px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.ruler .pin{animation:drop .35s both;animation-delay:calc(var(--i)*.12s)}
.ruler .truth{animation:grow .4s both;animation-delay:var(--d)}
.answer{animation:pop .4s both;animation-delay:var(--d)}
.banner{background:var(--hit);color:#fff;text-align:center;padding:12px;border-radius:var(--r);font:900 24px/1.1 Archivo;font-stretch:75%;animation:pop .5s both;animation-delay:var(--d)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg-deep);border-radius:12px;padding:12px 8px;text-align:center}
.stat .num{font-size:28px;line-height:1;display:block}
.stat span{font-size:12.5px;color:var(--muted)}
.big{font-size:84px;line-height:1;text-align:center;color:var(--tape)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:12px 16px;border-radius:12px;font-weight:600;max-width:90vw;display:none;z-index:9}
/* Profilbild mit Prestige-Rahmen */
.ava{--fc:transparent;position:relative;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:inline-block;color:var(--ink);
  font:800 calc(var(--s)*.38)/1 Archivo;font-stretch:75%;box-shadow:0 0 0 calc(var(--s)*.065) var(--fc)}
.ava img,.ava .ini{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--c)}
.ava .emb{position:absolute;right:-24%;bottom:-24%;width:62%;height:62%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
.embimg{width:100%;height:100%;object-fit:contain;display:block;border-radius:0!important;background:none!important}
.ava.t1,.ava.t2{--fc:#C8843C}.ava.t3,.ava.t4{--fc:#C9D3D6}.ava.t5,.ava.t6{--fc:#FFD23F}.ava.t7{--fc:#3DDC97}.ava.t8{--fc:#5AA9FF}.ava.t9{--fc:#FF4D6D}
.ava.t5,.ava.t6,.ava.t7,.ava.t8,.ava.t9,.ava.t10,.ava.t11{box-shadow:0 0 0 calc(var(--s)*.065) var(--fc),0 0 0 calc(var(--s)*.1) var(--bg-deep),0 0 0 calc(var(--s)*.125) var(--fc)}
.ava.t10{--fc:#FF8A00}
.ava.t11{--fc:#FFD23F}
.ava.t10,.ava.t11{animation:avaglow 2.8s ease-in-out infinite alternate}
.ava.t11 .emb{width:60%;height:60%;right:-22%;bottom:-22%}
@keyframes avaglow{from{filter:drop-shadow(0 0 3px rgba(255,150,40,.35))}to{filter:drop-shadow(0 0 12px rgba(255,180,60,.75))}}
@keyframes spin{to{transform:rotate(360deg)}}
.lv{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--bg-deep);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tape);border-radius:99px;transition:width .5s}
.bar.done i{background:var(--ok)}
.pcard{display:flex;gap:16px;align-items:center;width:100%;text-align:left}
.req{display:flex;flex-direction:column;gap:5px}
.req .row{justify-content:space-between;font-size:15px}
.ranks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rank{background:var(--bg-deep);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted);line-height:1.2}
.rank .embimg{width:100%;max-width:60px;height:auto;aspect-ratio:1;margin:0 auto 4px}
.rank.locked .embimg{filter:grayscale(1) brightness(.45)}
.rank.cur{box-shadow:inset 0 0 0 2px var(--tape);color:var(--paper)}
.pips{display:flex;gap:3px}.pips i{width:14px;height:6px;border-radius:3px;background:var(--bg-deep)}.pips i.on{background:var(--tape)}
.chal{display:flex;flex-direction:column;gap:7px;padding:13px 14px;border-radius:var(--r);background:var(--panel)}
.xpbig{font-size:52px;line-height:1;color:var(--tape)}
.parts{font-size:14.5px;color:var(--muted)}.parts div{display:flex;justify-content:space-between;padding:3px 0}
#modal{position:fixed;inset:0;background:rgba(3,15,17,.8);display:none;z-index:8;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:max(20px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom))}
#modal.on{display:flex;align-items:flex-start;justify-content:center}
#modal .panel{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;margin:auto 0}
@media (min-width:1000px){#modal{padding:32px 20px}#modal .panel{max-width:560px}}
.center{text-align:center}
.crown{color:var(--tape)}

/* ---- Politur: Tiefe, Metall, Licht ---- */
body{background:radial-gradient(120% 80% at 50% -10%,#15505A 0%,#0B2F35 45%,#051A1D 100%) fixed}
#wrap{background:
  radial-gradient(90% 50% at 50% 0%,rgba(255,210,63,.07),transparent 60%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 14px),
  linear-gradient(180deg,#0E3840,#08262B);box-shadow:0 0 80px rgba(0,0,0,.6)}
.panel,.chal{background:linear-gradient(180deg,#19535D 0%,#113E46 100%);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 12px 26px rgba(0,0,0,.35)}
.pl,.stat,.rank,.chip{background:linear-gradient(180deg,#0B2B30,#07201F);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 4px 10px rgba(0,0,0,.25)}
.pl{border-left-width:5px}
.btn{background:linear-gradient(180deg,#FFE88A 0%,#FFD23F 45%,#E8A91C 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 0 #9A7410,0 10px 22px rgba(255,190,40,.22);text-shadow:0 1px 0 rgba(255,255,255,.45)}
.btn:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 0 #9A7410}
.btn.small{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 0 #9A7410}
.btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.01));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.12);text-shadow:none}
.btn[disabled]{filter:saturate(.4)}
h1,.code,.xpbig,.big{background:linear-gradient(180deg,#FFF3B8 0%,#FFD23F 48%,#C98A12 52%,#FFE27A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.answer .num{text-shadow:0 0 28px rgba(255,90,78,.55)}
.bar{box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.bar i{background:linear-gradient(180deg,#FFE88A,#F2B92A);box-shadow:0 0 12px rgba(255,210,63,.55)}
.bar.done i{background:linear-gradient(180deg,#B9F5B9,#4FC46A);box-shadow:0 0 12px rgba(139,226,139,.5)}
#tapeBand{box-shadow:inset 0 10px 8px -6px rgba(255,255,255,.45),inset 0 -8px 8px -6px rgba(0,0,0,.35)}
.ruler .band{box-shadow:inset 0 8px 6px -5px rgba(255,255,255,.5),inset 0 -6px 6px -4px rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.4)}
.guess{box-shadow:0 0 0 1px rgba(255,210,63,.25),0 0 26px rgba(255,210,63,.18),inset 0 3px 8px rgba(0,0,0,.5)}
.opt{background:linear-gradient(180deg,#19535D,#113E46);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.1),0 6px 14px rgba(0,0,0,.3)}
.opt.mine{box-shadow:inset 0 0 0 3px var(--tape),0 0 22px rgba(255,210,63,.3)}
.banner{background:linear-gradient(100deg,#FF5A4E 0%,#FF8A3D 40%,#FFD23F 50%,#FF8A3D 60%,#FF5A4E 100%);background-size:250% 100%;animation:pop .5s both,shine 1.6s linear infinite;animation-delay:var(--d),var(--d);box-shadow:0 0 34px rgba(255,120,60,.5);text-shadow:0 2px 0 rgba(0,0,0,.25)}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
.ava{box-shadow:0 0 0 calc(var(--s)*.065) var(--fc),0 4px 10px rgba(0,0,0,.45)}
.logo{width:min(46vw,190px);aspect-ratio:1;display:block;margin:0 auto;filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:54px;height:54px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.wordmark{font-size:31px;line-height:1;letter-spacing:.5px;font-stretch:62%}
.wordmark.big{font-size:46px;text-align:center}
@media (min-width:1000px){.wordmark{font-size:44px}.wordmark.big{font-size:66px}}
.chal{flex-direction:row!important;align-items:center;gap:14px!important}
.chal .ci{width:62px;height:62px;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.chal .ci.none{filter:grayscale(1) brightness(.5)}
.chal .cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.trophy{width:min(52vw,210px);aspect-ratio:1;display:block;margin:0 auto -6px;filter:drop-shadow(0 0 34px rgba(255,200,80,.4)) drop-shadow(0 14px 18px rgba(0,0,0,.55));animation:slam .7s cubic-bezier(.2,1.4,.4,1) both}
.banner{display:flex;align-items:center;justify-content:center;gap:10px}.banner img{width:46px;height:46px}
/* Prestige-Moment */
#unlock{position:fixed;inset:0;z-index:20;display:none;place-items:center;text-align:center;background:radial-gradient(circle at 50% 42%,rgba(20,70,80,.96),rgba(3,14,16,.98) 70%);overflow:hidden;padding:24px}
#unlock.on{display:grid}
#unlock .rays{position:absolute;left:50%;top:42%;width:160vmax;height:160vmax;margin:-80vmax;background:repeating-conic-gradient(from 0deg,rgba(255,210,63,.13) 0 8deg,transparent 8deg 20deg);animation:spin 28s linear infinite;-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
#unlock .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:420px;width:100%}
#unlock .big-emb{width:min(64vw,260px);aspect-ratio:1;filter:drop-shadow(0 0 40px rgba(255,200,80,.55)) drop-shadow(0 18px 24px rgba(0,0,0,.6));animation:slam .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slam{0%{transform:scale(3) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:none}}
#unlock h1{font-size:52px;animation:pop .5s .45s both}
#unlock p{animation:pop .5s .6s both}
#unlock .btn{animation:pop .5s .9s both}

/* Spalten: am Handy unsichtbar, am Desktop echte Spalten */
.col{display:contents}
.deskonly{display:none!important}
.fr-dot{width:10px;height:10px;border-radius:50%;background:#56706F;flex:none}.fr-dot.on{background:#8BE28B;box-shadow:0 0 10px #8BE28B}.fr-dot.play{background:var(--tape);box-shadow:0 0 10px var(--tape)}
.mini{padding:7px 10px;border-radius:9px;font-size:13px;font-weight:700;background:var(--bg-deep);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16);white-space:nowrap}
.mini.go{background:var(--tape);color:var(--ink);box-shadow:none}
[data-user]{cursor:pointer}
/* Emotes */
#emotes{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;gap:8px;padding:8px 10px;border-radius:99px;z-index:7;background:rgba(5,26,29,.88);backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.1)}
#emotes.on{display:flex}
#emotes button{font-size:30px;line-height:1;width:48px;height:48px;border-radius:50%;animation:bob 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.18s);transition:transform .1s}
#emotes button:active{transform:scale(1.35)}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.1)}}
.emo-fly{position:fixed;z-index:9;pointer-events:none;font-size:54px;line-height:1;animation:boom 1.9s cubic-bezier(.2,.9,.3,1) forwards;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.emo-ring{position:fixed;z-index:8;pointer-events:none;width:20px;height:20px;margin:-10px;border-radius:50%;border:4px solid var(--c,#FFD23F);animation:ring .7s ease-out forwards}
.emo-name{position:fixed;z-index:9;pointer-events:none;font:800 13px/1 Archivo;padding:4px 8px;border-radius:8px;background:var(--c,#FFD23F);color:var(--ink);animation:boom 1.9s cubic-bezier(.2,.9,.3,1) forwards}

/* Spielerkarte im CoD-Stil */
.pcard{position:relative;display:flex;align-items:center;gap:12px;padding:14px 14px 18px;min-height:104px;border-radius:18px;overflow:hidden;
  background:linear-gradient(120deg,#0C343B 0%,#17525C 45%,#0A2A30 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 12px 26px rgba(0,0,0,.4)}
.pcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 3px,transparent 3px 22px);pointer-events:none}
.pcard .pcl{display:flex;align-items:center;flex:none;z-index:1}
.pcard .mid{flex:1;min-width:0;z-index:1;display:flex;flex-direction:column;gap:6px}
.pcard .who{display:flex;align-items:center;gap:8px;min-width:0}
.pcard .who b{font:800 21px/1.1 Archivo;font-stretch:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .lvrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.pcard .lvrow span:last-child{overflow:hidden;text-overflow:ellipsis}
.pcard .lvrow .bar{flex:1}
.pcard .trow{display:flex;align-items:center;gap:11px}
.pcard .who{padding-left:2px}
.pcard .trow .titleimg{flex:1;min-width:0}
.pcard .trow .pcemb{flex:none}
.pcard .pres img{width:100%;height:100%;object-fit:contain}
.pcard .streak{position:absolute;right:8px;bottom:4px;z-index:2;display:flex;align-items:flex-end;gap:2px}

.pcard .streak img{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,140,40,.65));animation:flick 1.1s ease-in-out infinite alternate}
.pcard .streak b{font:800 15px/1 Archivo;font-stretch:70%;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);margin-bottom:6px}
@keyframes flick{from{transform:scaleY(.94) translateY(1px);opacity:.88}to{transform:scaleY(1.06) translateY(-1px);opacity:1}}
/* Prestige 9 und 10 leben */
.pglow{position:relative;display:inline-block;isolation:isolate}
.pglow.p9::before{content:"";position:absolute;inset:-10%;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(255,60,90,.6),transparent 64%);filter:blur(3px);animation:ruby 1.9s ease-in-out infinite;pointer-events:none}
.pglow.p10::before{content:"";position:absolute;inset:-18%;border-radius:50%;z-index:-1;background:radial-gradient(circle at 50% 60%,rgba(255,150,40,.55),rgba(255,70,15,.22) 42%,transparent 70%);filter:blur(6px);animation:blaze 2.6s ease-in-out infinite alternate;pointer-events:none}
.pglow.p10 img,.pglow.p10 .embimg{animation:emberglow 2.6s ease-in-out infinite alternate}
@keyframes emberglow{from{filter:drop-shadow(0 0 4px rgba(255,140,40,.45)) saturate(1.05)}to{filter:drop-shadow(0 0 14px rgba(255,170,60,.9)) saturate(1.25) brightness(1.06)}}
.pglow.p11::before{content:"";position:absolute;inset:-20%;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(255,200,80,.55),rgba(255,120,20,.22) 42%,transparent 70%);filter:blur(7px);animation:masterglow 3s ease-in-out infinite alternate;pointer-events:none}
.pglow.p11 img,.pglow.p11 .embimg{animation:masterpulse 3.2s ease-in-out infinite alternate}
/* Effekte direkt im Emblem: per Maske auf die Form des Bildes begrenzt */
.pglow::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  -webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.pglow.p9::after{-webkit-mask-image:url(/emblems/p9.webp?v=${AVER});mask-image:url(/emblems/p9.webp?v=${AVER});
  background:radial-gradient(circle at 50% 52%,rgba(255,255,255,.95),rgba(255,70,110,.75) 22%,rgba(255,40,80,.15) 40%,transparent 60%);
  animation:gemflash 2.4s ease-in-out infinite}
@keyframes gemflash{0%,100%{opacity:.12;transform:scale(.97)}40%{opacity:1;transform:scale(1.03)}55%{opacity:.55}70%{opacity:.85}}
.pglow.p10::after{-webkit-mask-image:url(/emblems/p10.webp?v=${AVER});mask-image:url(/emblems/p10.webp?v=${AVER});
  background:radial-gradient(ellipse 42% 60% at 50% 70%,rgba(255,235,150,.95),rgba(255,150,30,.55) 45%,rgba(255,70,0,.12) 70%,transparent 85%);
  background-size:100% 190%;animation:burn 1.9s ease-in-out infinite alternate;opacity:.75}
@keyframes burn{from{background-position:0 88%;opacity:.45}to{background-position:0 22%;opacity:.95}}
.pglow.p11::after{-webkit-mask-image:url(/emblems/p11.webp?v=${AVER});mask-image:url(/emblems/p11.webp?v=${AVER});
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.1) 45%,rgba(255,245,200,.85) 50%,rgba(255,255,255,.1) 55%,transparent 65%);
  background-size:300% 300%;animation:sheen 3s ease-in-out infinite}
@keyframes sheen{0%{background-position:140% 140%}50%,100%{background-position:-70% -70%}}
@keyframes masterpulse{from{filter:drop-shadow(0 0 5px rgba(255,190,60,.45))}to{filter:drop-shadow(0 0 16px rgba(255,210,90,.95)) brightness(1.07)}}
@keyframes masterglow{from{opacity:.4;transform:scale(.96)}to{opacity:.95;transform:scale(1.06)}}

@keyframes ruby{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
@keyframes blaze{from{opacity:.45;transform:scale(.97)}to{opacity:.95;transform:scale(1.05)}}

.bulls{position:absolute;right:-4px;top:-10px;width:64px;height:64px;animation:pop .5s both;animation-delay:.3s;filter:drop-shadow(0 0 12px rgba(255,200,60,.8))}

.mcsum{text-align:center;padding:16px 14px;border-radius:var(--r);background:linear-gradient(180deg,#123E45,#0B2B30);box-shadow:inset 0 0 0 2px var(--line);animation:pop .35s both}
.mcsum.good{box-shadow:inset 0 0 0 2px var(--ok),0 0 22px rgba(139,226,139,.25)}
.mcsum.bad{box-shadow:inset 0 0 0 2px var(--hit),0 0 22px rgba(255,90,78,.2)}
.mcsum .big2{font:800 26px/1.1 Archivo;font-stretch:80%}
.mcsum.good .big2{color:var(--ok)}.mcsum.bad .big2{color:#FFB3AC}

.ava .frm{position:absolute;inset:-17%;width:134%;height:134%;object-fit:contain;pointer-events:none;border-radius:0;background:none}
.ava.hasfrm{box-shadow:none!important}
.frm.fire{animation:flick 2.2s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px rgba(255,140,40,.8))}
.frm.spark{animation:sparkf 1.6s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(90,169,255,.85))}
.frm.pulse{animation:pulsef 2.4s ease-in-out infinite}
.frm.spin{animation:spin 14s linear infinite}
.frm.lava{animation:lavaf 2.6s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px rgba(255,150,40,.8))}
.frm.dev{animation:spin 8s linear infinite, devglow 1.6s ease-in-out infinite alternate}
@keyframes sparkf{0%,100%{opacity:.85;filter:drop-shadow(0 0 4px rgba(90,169,255,.6))}45%{opacity:1;filter:drop-shadow(0 0 16px rgba(160,220,255,1))}}
@keyframes pulsef{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.05);opacity:1}}
@keyframes lavaf{from{filter:drop-shadow(0 0 5px rgba(255,120,20,.55))}to{filter:drop-shadow(0 0 18px rgba(255,190,60,.95))}}
@keyframes devglow{from{filter:drop-shadow(0 0 6px rgba(90,169,255,.7))}to{filter:drop-shadow(0 0 18px rgba(255,150,40,.95))}}
.framegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;padding:12px}
.framegrid button{padding:8px 4px 6px;border-radius:12px;background:var(--bg-deep);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);line-height:1.15;text-align:center}
.framegrid button.on{box-shadow:inset 0 0 0 2.5px var(--tape);color:var(--paper)}
.framegrid button.lock{opacity:.45}
.framegrid button.lock .ava .frm{filter:grayscale(.55) brightness(.78)}
.cardgrid button.lock img{filter:grayscale(.5) brightness(.8)}
.tlist button.lock .titleimg{filter:grayscale(.5) brightness(.8)}

/* Siegestreppe */
.stairs{display:flex;flex-direction:column-reverse;gap:8px;margin-top:10px}
.step{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin-left:var(--in);
  background:linear-gradient(180deg,#0E3138,#081F23);border-left:5px solid var(--c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 14px rgba(0,0,0,.35);
  animation:stepin .4s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d)}
.step.me{box-shadow:inset 0 0 0 2px var(--tape),0 6px 14px rgba(0,0,0,.35)}
.step.first{background:linear-gradient(180deg,#1C4A2E,#0B2B22);border-left-color:var(--tape)}
.step .rk{width:28px;text-align:center;font:800 19px/1 Archivo;font-stretch:70%;color:var(--muted)}
.step.first .rk{font-size:22px}
.step .nm{flex:1;min-width:0;font-weight:700;display:flex;flex-direction:column;gap:5px}
.step .ln1{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .ln1 small{color:var(--muted);font-weight:600}
.step .ln1 .tag{flex:none}
.step .bar{height:7px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden}
.step .bar i{display:block;height:100%;background:linear-gradient(90deg,#E8A91C,#FFE88A);border-radius:99px;animation:grow2 .6s ease-out both;animation-delay:calc(var(--d) + .1s);transform-origin:left}
.step.first .bar i{background:linear-gradient(90deg,#4FC46A,#B9F5B9)}
.step .diff{font-size:12.5px;color:var(--muted);font-weight:500}
.step .val{font:800 18px/1 Archivo;font-stretch:66%;text-align:right}
.step .pts{min-width:62px;text-align:right;font:800 19px/1 Archivo;font-stretch:70%;color:var(--ok)}
.step .pts.zero{color:var(--muted)}
@keyframes stepin{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow2{from{transform:scaleX(0)}to{transform:scaleX(1)}}

#bullsfx{position:fixed;inset:0;z-index:12;display:none;place-items:center;pointer-events:none;
  background:radial-gradient(circle at 50% 45%,rgba(255,190,60,.35),rgba(3,15,17,.82) 62%)}
#bullsfx.on{display:grid;animation:bfade 2.4s ease-out forwards}
#bullsfx .rays{position:absolute;left:50%;top:45%;width:180vmax;height:180vmax;margin:-90vmax;
  background:repeating-conic-gradient(from 0deg,rgba(255,210,63,.16) 0 7deg,transparent 7deg 18deg);animation:spin 14s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%)}
#bullsfx .in{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
#bullsfx img{width:min(46vw,190px);filter:drop-shadow(0 0 30px rgba(255,200,80,.85));animation:slam .55s cubic-bezier(.2,1.4,.4,1) both}
#bullsfx h1{font-size:min(13vw,58px);animation:pop .4s .2s both}
#bullsfx p{font-size:19px;animation:pop .4s .35s both}
@keyframes bfade{0%{opacity:0}8%{opacity:1}80%{opacity:1}100%{opacity:0}}
/* Kompakte Zeilen, damit acht Spieler auf einen Handy-Schirm passen */
@media (max-height:900px){
  .stairs{gap:6px}
  .step{padding:7px 10px;gap:8px}

  .step .diff{font-size:11.5px}
  .step .bar{height:6px}

}

#pushbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r);background:linear-gradient(180deg,#19535D,#113E46);box-shadow:inset 0 0 0 1.5px rgba(255,210,63,.35)}
#pushbar .grow{font-size:14px;line-height:1.3}
#pushbar b{display:block;font-size:15px}

.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:#4FC46A;color:#08231A;font:800 13px/1 Archivo;box-shadow:0 0 10px rgba(79,196,106,.6)}
.cardgrid button.fresh,.framegrid button.fresh,.tlist button.fresh{box-shadow:inset 0 0 0 3px #FFD23F,0 0 16px rgba(255,210,63,.55);animation:freshglow 1.6s ease-in-out infinite alternate}

.cardgrid button.fresh::after,.framegrid button.fresh::after{content:"NEU";position:absolute;right:4px;top:4px;padding:3px 6px;border-radius:99px;background:linear-gradient(135deg,#FFE27A,#E0A21E);color:#2A1600;font:900 10px/1 Archivo;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.tlist button.fresh{position:relative}.tlist button.fresh::after{content:"NEU";position:absolute;right:8px;top:8px;padding:3px 7px;border-radius:99px;background:linear-gradient(135deg,#FFE27A,#E0A21E);color:#2A1600;font:900 10px/1 Archivo}
.cardgrid button,.framegrid button{position:relative}
.tlist button.fresh .why b::after{content:" NEU";color:#4FC46A;font-size:11px}
.chalhint{display:flex;flex-direction:column;gap:8px}
.chalhint .ch{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:var(--bg-deep);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.07)}
.chalhint img{width:34px;height:34px;flex:none;object-fit:contain}
.chalhint .t{flex:1;min-width:0;font-size:13.5px}
.chalhint .t b{display:block;font-size:14.5px}
.chalhint .bar{height:6px;border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden;margin-top:4px}
.chalhint .bar i{display:block;height:100%;background:linear-gradient(90deg,#E8A91C,#FFE88A)}

.unlocks{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding:12px;border-radius:12px;background:rgba(79,196,106,.12);box-shadow:inset 0 0 0 1.5px rgba(79,196,106,.5)}
.unlocks b{color:#8BE28B;font-size:14px}
.uitem{font-size:14.5px;font-weight:700}
.uitem small{color:var(--muted);font-weight:600}

/* Sammelkarten */
.dia{display:inline-flex;align-items:center;gap:5px;font:800 16px/1 Archivo;font-stretch:75%;color:#9FE8FF}
.dia img{width:20px;height:20px}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs2 button{padding:9px 13px;border-radius:99px;background:var(--bg-deep);font-weight:700;font-size:14px;color:var(--muted);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.1)}
.tabs2 button.on{background:var(--tape);color:var(--ink);box-shadow:none}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cgrid figure{display:flex;flex-direction:column;gap:6px;position:relative}
#opener .slot .cbadge{left:auto;right:6px;top:6px}
.cgrid img{width:100%;height:auto;border-radius:10px;box-shadow:0 8px 18px rgba(0,0,0,.45)}

.cgrid figcaption{font-size:12.5px;color:var(--muted);line-height:1.25}
.cgrid b{display:block;color:var(--paper);font-size:13.5px}
.cnt{position:absolute;right:6px;top:6px;background:rgba(5,26,29,.9);border-radius:99px;padding:3px 8px;font:800 12px/1 Archivo;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2)}
.packcard{position:relative;display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:linear-gradient(180deg,#19535D,#113E46);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.newtag{position:absolute;right:10px;top:10px;padding:4px 10px;border-radius:99px;background:linear-gradient(180deg,#FF8FCF,#FF3DA6);color:#2A0518;font:900 12px/1 Archivo;font-stretch:80%;letter-spacing:.5px;box-shadow:0 0 14px rgba(255,80,170,.7);animation:pulsef 1.8s ease-in-out infinite}
.packcard img{width:92px;height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
.packcard .t{flex:1;min-width:0}
.odds{font-size:12.5px;color:var(--muted);line-height:1.35}
#opener{position:fixed;inset:0;z-index:11;display:none;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(255,210,63,.18),rgba(3,15,17,.92) 60%)}
#opener.on{display:grid}
#opener .wrap{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:20px}
#opener .slot{position:relative;border-radius:14px;animation:flip .55s cubic-bezier(.2,.9,.3,1) both;animation-delay:var(--d)}
#opener .rev{display:block;width:min(42vw,190px);border-radius:12px;cursor:pointer}
#opener .slot::after{content:"";position:absolute;inset:-6px;border-radius:18px;pointer-events:none;opacity:0;
  animation:glowin .5s ease-out forwards;animation-delay:calc(var(--d) + .35s)}
#opener .slot.r-haeufig::after{box-shadow:0 0 0 2px rgba(200,220,220,.5),0 0 18px rgba(200,220,220,.35)}
#opener .slot.r-selten::after{box-shadow:0 0 0 2px rgba(120,180,255,.8),0 0 26px rgba(90,169,255,.7)}
#opener .slot.r-holo::after{box-shadow:0 0 0 2px rgba(150,240,255,.9),0 0 34px rgba(120,220,255,.85)}
#opener .slot.r-ultra::after,#opener .slot.r-legend::after{box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 44px rgba(255,240,180,.95)}
#opener .slot.r-ext::after{box-shadow:0 0 0 3px rgba(255,170,60,1),0 0 54px rgba(255,140,30,.95)}
#opener .slot.r-ghost::after{box-shadow:0 0 0 3px rgba(255,255,255,1),0 0 70px rgba(200,235,255,1)}
#opener .slot.r-ghost{animation:flip .55s cubic-bezier(.2,.9,.3,1) both, shake .5s ease-out both}
.cbadge.ghost{background:linear-gradient(120deg,#FFFFFF,#CFE6F5);color:#0A2530;box-shadow:0 0 14px rgba(220,245,255,.95)}
#opener .slot.r-ultra,#opener .slot.r-legend,#opener .slot.r-ext{animation:flip .55s cubic-bezier(.2,.9,.3,1) both, shake .5s ease-out both}
@keyframes glowin{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{}30%{transform:translateY(-6px) scale(1.04)}60%{transform:translateY(2px) scale(1)}}
@keyframes flip{0%{transform:rotateY(90deg) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
#opener .cta{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%)}
.sold{opacity:.55}
.mini.sent{background:rgba(79,196,106,.2);color:#8BE28B;box-shadow:inset 0 0 0 1.5px rgba(79,196,106,.6)}

.cbadge{position:absolute;left:6px;top:6px;display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:99px;font:800 12px/1 Archivo;background:rgba(5,26,29,.9);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.cbadge.holo{background:linear-gradient(120deg,#7CE8FF,#B98CFF,#FF9AD5);color:#08231A;box-shadow:0 0 10px rgba(150,200,255,.7);animation:pulsef 2.4s ease-in-out infinite}
.cbadge.ultra{background:linear-gradient(120deg,#FFE88A,#E8A91C);color:var(--ink);box-shadow:0 0 10px rgba(255,210,63,.8)}
.cbadge.ext{background:conic-gradient(#FF6B6B,#FFD23F,#8BE28B,#5AA9FF,#C4A5FF,#FF6B6B);color:#06181B;box-shadow:0 0 14px rgba(255,255,255,.55);animation:spin 6s linear infinite}
.cfilter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cfilter button{padding:7px 11px;border-radius:99px;background:var(--bg-deep);font-weight:700;font-size:13px;color:var(--muted);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.1)}
.cfilter button.on{background:var(--tape);color:var(--ink);box-shadow:none}
#cardview{position:fixed;inset:0;z-index:13;display:none;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(20,70,80,.6),rgba(3,12,14,.95) 65%);padding:20px;overflow:auto}

  background-size:220% 220%;background-position:var(--sx,50%) var(--sy,50%)}

.watchbar{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;background:rgba(5,26,29,.9);backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14);font-size:13.5px;color:var(--muted)}

/* Glücksspiel */

.wheel img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

  background:conic-gradient(#1D7A4A 0 2.7deg,#C0342F 2.7deg 5.4deg,#141B1C 5.4deg 8.1deg,#C0342F 8.1deg 10.8deg,#141B1C 10.8deg 13.5deg,#C0342F 13.5deg 16.2deg,#141B1C 16.2deg 18.9deg,#C0342F 18.9deg 21.6deg,#141B1C 21.6deg 24.3deg,#C0342F 24.3deg 27deg,#141B1C 27deg 29.7deg,#C0342F 29.7deg 32.4deg,#141B1C 32.4deg 35.1deg,#C0342F 35.1deg 37.8deg,#141B1C 37.8deg 40.5deg,#C0342F 40.5deg 43.2deg,#141B1C 43.2deg 45.9deg,#C0342F 45.9deg 48.6deg,#141B1C 48.6deg 51.3deg,#C0342F 51.3deg 54deg,#141B1C 54deg 56.7deg,#C0342F 56.7deg 59.4deg,#141B1C 59.4deg 62.1deg,#C0342F 62.1deg 64.8deg,#141B1C 64.8deg 67.5deg,#C0342F 67.5deg 70.2deg,#141B1C 70.2deg 72.9deg,#C0342F 72.9deg 75.6deg,#141B1C 75.6deg 78.3deg,#C0342F 78.3deg 81deg,#141B1C 81deg 83.7deg,#C0342F 83.7deg 86.4deg,#141B1C 86.4deg 89.1deg,#C0342F 89.1deg 91.8deg,#141B1C 91.8deg 94.5deg,#C0342F 94.5deg 97.2deg,#141B1C 97.2deg 100deg,#C0342F 100deg 180deg,#141B1C 180deg 260deg,#C0342F 260deg 340deg,#141B1C 340deg 360deg);
  box-shadow:inset 0 0 0 10px #C89A3C,inset 0 0 0 13px #1a2426,0 14px 34px rgba(0,0,0,.55)}
.wheel::after{content:"";position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2A6B72,#0B2F35 70%);box-shadow:inset 0 0 0 4px #C89A3C,0 0 24px rgba(0,0,0,.6)}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--tape);filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));z-index:2}
.wheelwrap{--W:min(74vw,290px);border-radius:50%}
.pockets{position:absolute;inset:0;border-radius:50%;z-index:1;
  -webkit-mask:radial-gradient(circle,transparent 0 calc(var(--W) * .27),#000 calc(var(--W) * .275) calc(var(--W) * .37),transparent calc(var(--W) * .375));
  mask:radial-gradient(circle,transparent 0 calc(var(--W) * .27),#000 calc(var(--W) * .275) calc(var(--W) * .37),transparent calc(var(--W) * .375));
  box-shadow:inset 0 0 0 1px rgba(200,154,60,.6)}
.pockets::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from -4.865deg,rgba(200,154,60,.85) 0 .6deg,transparent .6deg 9.73deg)}
.balltrack{position:absolute;inset:0;z-index:6;pointer-events:none;transition:transform 4.6s cubic-bezier(.12,.62,.12,1)}
.balltrack[hidden]{display:none}
.ball{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#d7e0e2 55%,#8fa0a3);box-shadow:0 2px 6px rgba(0,0,0,.6),0 0 10px rgba(255,255,255,.55);
  transform:translateY(calc(var(--W) * -0.43));transition:transform 1.1s cubic-bezier(.3,1.4,.5,1) 3.3s}

.ballnum{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;display:grid;place-items:center;width:78px;height:78px;border-radius:50%;font:900 30px/1 Archivo;font-stretch:70%;color:#fff;background:rgba(6,22,26,.9);box-shadow:inset 0 0 0 3px rgba(255,255,255,.25)}

/* ===== Höhepunkt ===== */
#hl{position:fixed;inset:0;z-index:20;display:none;place-items:center;overflow:hidden;background:rgba(2,8,10,0);transition:background .4s}
#hl.on{display:grid;background:rgba(2,8,10,.9)}
#hl .rays{position:absolute;left:50%;top:46%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;opacity:0;
  background:repeating-conic-gradient(from 0deg,var(--c1) 0 6deg,transparent 6deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0 8%,rgba(0,0,0,.6) 22%,transparent 48%);mask:radial-gradient(circle,#000 0 8%,rgba(0,0,0,.6) 22%,transparent 48%);
  animation:raysin .7s .15s ease-out forwards, raysspin 14s linear infinite}
@keyframes raysin{to{opacity:.55}}
@keyframes raysspin{to{transform:rotate(360deg)}}
#hl .burst{position:absolute;left:50%;top:46%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--c2);box-shadow:0 0 80px 40px var(--c2);opacity:0;animation:burst .9s .1s ease-out}
@keyframes burst{0%{opacity:1;transform:scale(.2)}60%{opacity:.9}100%{opacity:0;transform:scale(9)}}
#hl .stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px}
#hl .banner{font:400 clamp(38px,11vw,72px)/1 Anton,Impact,sans-serif;letter-spacing:2px;color:transparent;background:var(--txt);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 18px var(--c2)) drop-shadow(0 6px 0 rgba(0,0,0,.55));opacity:0;transform:scale(2.4);animation:slam .5s .95s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes slam{to{opacity:1;transform:scale(1)}}
#hl .sub{font:800 14px Archivo;letter-spacing:3px;color:var(--c2);opacity:0;animation:fadein .4s 1.35s forwards;text-transform:uppercase}
@keyframes fadein{to{opacity:1}}
#hl .big{position:relative;width:min(70vw,330px);opacity:0;transform:translateY(40vh) scale(.35) rotate(-14deg);animation:rise 1s .2s cubic-bezier(.16,1.1,.3,1) forwards}
@keyframes rise{60%{opacity:1}100%{opacity:1;transform:none}}
#hl .big img{display:block;width:100%;border-radius:18px;box-shadow:0 0 0 4px var(--c1),0 0 60px 8px var(--c2),0 30px 60px rgba(0,0,0,.6)}
#hl .big .float{animation:hover 3.2s 1.3s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
#hl .shine{position:absolute;inset:0;border-radius:18px;overflow:hidden;pointer-events:none}
#hl .shine::before{content:"";position:absolute;top:-20%;bottom:-20%;width:38%;left:-60%;transform:skewX(-18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:sweep 1.1s 1.2s ease-in-out, sweep 1.1s 3.6s ease-in-out}
@keyframes sweep{to{left:130%}}
#hl .sp{position:absolute;left:50%;top:46%;width:8px;height:8px;border-radius:50%;background:var(--c2);box-shadow:0 0 10px var(--c2);opacity:0;animation:spark 1.6s var(--dl) ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}
#hl .tap{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom,0px));left:0;right:0;font:700 14px Archivo;color:var(--muted);opacity:0;animation:fadein .4s 2s forwards}
#hl.ext{--c1:#FFB547;--c2:#FF9A2E;--txt:linear-gradient(180deg,#FFF6C8,#FFD23F 45%,#E0831A)}
#hl.ghost{--c1:#FFFFFF;--c2:#A9E6FF;--txt:linear-gradient(180deg,#FFFFFF,#D9F3FF 45%,#8FD3F5)}
#hl.ghost .big img{filter:drop-shadow(0 0 0 transparent)}
#hl.ghost .big{animation:rise 1s .2s cubic-bezier(.16,1.1,.3,1) forwards, ghostfl 2.4s 1.2s ease-in-out infinite}
@keyframes ghostfl{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25) saturate(1.2)}}

#hl .stage{animation:hlshake .5s .95s ease-out}
@keyframes hlshake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
#hl .tap{color:#9FB8B6}

<body>
<div id="wrap">
  <div id="tape" aria-hidden="true"><div id="tapeBand"></div><div id="tapeSec"></div></div>
  <main id="app"></main>
</div>
<button id="sound" title="Ton an/aus" aria-label="Ton an oder aus">🔊</button>
<button id="quit" title="Match verlassen" aria-label="Match verlassen">✕</button>
<div id="emotes"></div>
<div class="watchbar" id="watchbar" hidden></div>
<div id="cardview"></div>
<div id="opener"></div>
<div id="bullsfx"></div>
<div id="unlock"></div>
<div id="modal"></div>
<div id="toast" role="status"></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const AVER = '19';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const app = $('#app');
let token = null; try { token = localStorage.getItem('sz_token'); } catch (e) {}
let S = null, L = { open: [], max: 2, running: 0 }, home = null, socket = null, offset = 0, viewKey = '', authTab = 'login', lastVibe = '', page = 'home', privMode = false, friends = [];

const fmt = (v, unit) => v === null || v === undefined ? '–' : (unit === 'Jahr' ? String(Math.round(v)) : Number(v).toLocaleString('de-DE', { maximumFractionDigits: 3 }));
const initials = (n) => n.trim().slice(0, 2).toUpperCase();
// Eigene Prestige-Embleme (Rang 1-10), als SVG gezeichnet
const PAL = ['#FFD23F', '#FF7A6B', '#4FD1C5', '#C4A5FF', '#8BE28B', '#FFA94D'];
const TIER = ['', '#C8843C', '#C8843C', '#C9D3D6', '#C9D3D6', '#FFD23F', '#FFD23F', '#3DDC97', '#5AA9FF', '#FF4D6D', '#FF8A00'];
function emblem(t) { const i = `<img class="embimg" src="/emblems/p${t}.webp?v=${AVER}" alt="" draggable="false">`; return t >= 9 ? `<span class="pglow p${t}" style="width:100%;height:100%">${i}</span>` : i; }
function avatar(p, size = 40, emb = true) {
  const t = Math.max(0, Math.min(11, Number(p.presShown === undefined || p.presShown === null ? p.prestige : p.presShown) || 0));
  const fr = p.frame ? `<img class="frm ${esc(p.frameAnim || '')}" src="/emblems/${esc(p.frame)}.webp?v=${AVER}" alt="">` : '';
  return `<span class="ava t${t} ${p.frame ? 'hasfrm' : ''}" style="--s:${size}px;--c:${p.color || PAL[(p.id || 0) % 6]}">${p.av ? `<img src="/api/avatar/${p.id}?v=${p.av}" alt="">` : `<span class="ini">${esc(initials(p.name))}</span>`}${fr}${t && emb ? `<span class="emb">${emblem(t)}</span>` : ''}</span>`;
}
const flameHtml = (p, size) => (p && p.streak ? `<span class="fl"><img src="/emblems/streak${Math.min(5, p.streak)}.webp?v=${AVER}" style="width:${size || 20}px;height:${size || 20}px" alt=""><b>${Math.min(99, p.streak)}</b></span>` : '');
function streakHtml(p) {
  const n = Math.min(5, p.streak || 0);
  return n ? `<div class="streak"><img src="/emblems/streak${n}.webp?v=${AVER}" alt=""><b>${n}</b></div>` : '';
}
function playerCard(p, extra) {
  const lv = p.max ? 1 : (p.next ? p.into / p.next : 0);
  return `<div class="pcard">
    <div class="mid"><div class="who">${tagHtml(p)}<b>${esc(p.name)}</b></div>
      <div class="trow">${avatar(p, 56)}${p.title ? titleHtml(p) : '<span class="sub grow" style="font-size:13px">Kein Titel</span>'}
        ${p.emblem ? `<img class="pcemb${animOf(p.emblem)}" style="--s:50px" src="/emblems/pc_${esc(p.emblem)}.webp?v=${AVER}" alt="">` : ''}</div>
      <div class="lvrow"><span class="num" style="font-size:16px;color:var(--paper)">Lv ${p.level}</span><span class="bar"><i style="width:${Math.round(lv * 100)}%"></i></span><span>${p.max ? 'max' : p.into + '/' + p.next}</span></div>
      ${extra || ''}</div>
    ${streakHtml(p)}</div>`;
}
const animOf = (id) => { const c = home && home.cards; if (!c || !id) return ''; const x = [...c.emblems, ...c.titles].find((y) => y.id === id); return x && x.anim ? ' a-' + x.anim : ''; };
const embHtml = (p, size) => (p && p.emblem ? `<img class="pcemb${animOf(p.emblem)}" style="--s:${size || 34}px" src="/emblems/pc_${esc(p.emblem)}.webp?v=${AVER}" alt="">` : '');
const titleHtml = (p, big) => (p && p.title ? `<img class="titleimg${big ? ' big' : ''}${animOf(p.title.id)}" src="/emblems/title_${esc(p.title.id)}.webp?v=${AVER}" alt="${esc(p.title.text)}" title="${esc(p.title.text)}">` : '');
const tagHtml = (p) => (p && p.tag ? `<span class="ctag c-${esc(p.tagColor || 'cyan')}">[${esc(p.tag)}]</span>` : '');
const withTag = (p, name) => tagHtml(p) + esc(name === undefined ? p.name : name);
function seenText(u) {
  if (!u || !u.lastSeen) return 'noch nie online';
  const m = Math.round((Date.now() - u.lastSeen) / 60000);
  if (m < 1) return 'gerade eben';
  if (m < 60) return 'vor ' + m + ' Min.';
  const h = Math.round(m / 60);
  if (h < 24) return 'vor ' + h + ' Std.';
  const d = Math.round(h / 24);
  return d === 1 ? 'gestern' : 'vor ' + d + ' Tagen';
}
const onlineText = (u) => (u.online ? (u.act && u.act !== 'online' ? u.act : 'online') : 'zuletzt ' + seenText(u));
const rankText = (p) => (p.prestige ? `P${p.prestige} · ` : '') + `Lv ${p.level}`;
function closeModal() { $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
function askPassword(code, wrong) {
  $('#modal').innerHTML = `<form class="panel" id="pwJoin"><h2>Match ${esc(code)} ist geschützt</h2><div><label for="pwJ">Passwort</label><input class="field" id="pwJ" maxlength="20" autocomplete="off"></div><div class="err">${wrong ? 'Das Passwort stimmt nicht.' : ''}</div><button class="btn">Beitreten</button><button type="button" class="btn ghost" id="pwCancel">Abbrechen</button></form>`;
  $('#modal').classList.add('on'); $('#pwJ').focus();
  $('#pwJoin').onsubmit = (e) => { e.preventDefault(); socket.emit('join', { code, password: $('#pwJ').value }); closeModal(); };
  $('#pwCancel').onclick = closeModal;
}
async function uploadAvatar(file) {
  try {
    const img = new Image(); img.src = URL.createObjectURL(file); await img.decode();
    const c = document.createElement('canvas'); c.width = c.height = 160; const m = Math.min(img.width, img.height);
    c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, 160, 160);
    await api('/api/avatar', { data: c.toDataURL('image/jpeg', 0.82) });
    toast('Profilbild gespeichert'); await loadHome(); viewKey = ''; render();
  } catch (e) { toast(e.message && e.status ? e.message : 'Das Bild ließ sich nicht lesen. Nimm ein JPG oder PNG.'); }
}

// Kleine Synth-Sounds, kein Download nötig
let tagColor = 'cyan', themeSel = null, boardMode = 'points', openFold = '', needCode = false;
let freshKeep = new Set(); // in dieser Sitzung als neu angezeigt, bleibt bis zum Verlassen markiert
const seenSet = () => { const s0 = new Set((home && home.seen) || []); freshKeep.forEach((k) => s0.delete(k)); return s0; };
const freshOf = (list, kind) => { const s2 = seenSet(); return list.filter((x) => x.unlocked && !s2.has(kind + ':' + x.id)); };
function markSeen(ids) { if (!ids.length) return; ids.forEach((k) => freshKeep.add(k)); api('/api/seen', { ids }).then(() => { if (home) home.seen = [...new Set([...(home.seen || []), ...ids])]; }).catch(() => {}); }
let actx = null, master = null, muted = false, vol = 0.7; try { muted = localStorage.getItem('sz_mute') === '1'; const v = parseFloat(localStorage.getItem('sz_vol')); if (v >= 0 && v <= 1) vol = v; } catch (e) {}
function setVol() { if (master) master.gain.value = vol * 1.6; }
function noise(dur, vol, cut) {
  const n = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = actx.createBufferSource(); src.buffer = buf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut || 2000;
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(f).connect(g).connect(master); src.start();
}
function tone(f, t0, dur, type = 'triangle', vol = 0.12) {
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, actx.currentTime + t0); g.gain.linearRampToValueAtTime(vol, actx.currentTime + t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t0 + dur);
  o.connect(g).connect(master); o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + dur + 0.05);
}
function sfx(name) {
  if (muted || !actx) return;
  try {
    if (name === 'tick') tone(880, 0, 0.07, 'square', 0.05);
    if (name === 'question') { tone(523, 0, 0.12); tone(784, 0.1, 0.18); }
    if (name === 'sent') tone(660, 0, 0.1, 'sine');
    if (name === 'emote') { tone(880, 0, 0.06, 'sine', 0.08); tone(1320, 0.05, 0.09, 'sine', 0.07); }
    if (name === 'dart' || name === 'dartbest' || name === 'dartexact') {
      const big = name !== 'dart';
      noise(0.05, big ? 0.22 : 0.13, big ? 2600 : 1800);
      tone(big ? 150 : 190, 0, big ? 0.16 : 0.1, 'sine', big ? 0.22 : 0.13);
      if (name === 'dartexact') [880, 1320, 1760].forEach((f, i) => tone(f, 0.06 + i * 0.06, 0.25, 'triangle', 0.1));
    }
    if (name === 'reveal') { tone(392, 0, 0.15); tone(587, 0.12, 0.25); }
    if (name === 'exact') [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.09, 0.35, 'sawtooth', 0.09));
    if (name === 'win') [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.5, 'triangle', 0.13));
    if (name === 'prestige') { [196, 294, 392, 587, 784, 1175].forEach((f, i) => tone(f, i * 0.11, 0.9, 'sawtooth', 0.08)); tone(98, 0, 1.4, 'sine', 0.2); }
  } catch (e) {}
}
// iOS schaltet Web-Audio beim Stummschalter ab. Ein stiller Dauerton über ein Audio-Element
// setzt die Wiedergabe-Kategorie um, dann kommt der Ton meist trotzdem durch.
let silentEl = null;
function unlockAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.connect(actx.destination); setVol(); } catch (e) {} }
  else if (actx.state === 'suspended') actx.resume();
  if (!silentEl) {
    try {
      silentEl = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
      silentEl.loop = true; silentEl.volume = 0.001; silentEl.setAttribute('playsinline', '');
      silentEl.play().catch(() => {});
    } catch (e) {}
  } else if (silentEl.paused) silentEl.play().catch(() => {});
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') unlockAudio(); });
function showBulls(names) {
  const el = $('#bullsfx');
  el.innerHTML = `<div class="rays"></div><div class="in"><img src="/emblems/bullseye.webp?v=${AVER}" alt=""><h1>PUNKTLANDUNG</h1><p>${esc(names)}</p></div>`;
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  clearTimeout(showBulls.t); showBulls.t = setTimeout(() => el.classList.remove('on'), 2500);
}
function showUnlock(rank, name) {
  const u = $('#unlock');
  u.innerHTML = `<div class="rays"></div><div class="in"><p class="sub">Neuer Rang freigeschaltet</p><div class="big-emb">${emblem(rank)}</div><h1>Prestige ${rank}</h1><p style="font-size:20px;font-weight:700">${esc(name)}</p><p class="sub">Der neue Rahmen ist jetzt an deinem Profilbild.</p><button class="btn" id="unlockOk" style="margin-top:10px">Weiter</button></div>`;
  u.classList.add('on'); sfx('prestige'); try { navigator.vibrate && navigator.vibrate([80, 60, 80, 60, 300]); } catch (e) {}
  $('#unlockOk').onclick = () => { u.classList.remove('on'); u.innerHTML = ''; };
}

function showCodeReveal(r) {
  const u = $('#unlock'); const it = r.items || { emblems: [], titles: [], frames: [] };
  const me = (home && home.me) || {};
  const tiles = [
    ...it.titles.map((t) => `<div class="cr-item cr-wide" style="--d:${0}"><img class="titleimg a-${esc(t.anim || '')}" src="/emblems/title_${esc(t.id)}.webp?v=${AVER}" alt=""><b>${esc(t.text)}</b><small>Titel</small></div>`),
    ...it.emblems.map((e) => `<div class="cr-item"><img class="pcemb a-${esc(e.anim || '')}" style="--s:74px" src="/emblems/pc_${esc(e.id)}.webp?v=${AVER}" alt=""><b>${esc(e.name)}</b><small>Emblem</small></div>`),
    ...it.frames.map((f) => `<div class="cr-item">${avatar({ ...me, frame: f.id, frameAnim: f.anim }, 74, false)}<b>${esc(f.name)}</b><small>Rahmen</small></div>`),

// ---------- Poker: Texas Hold'em ----------
let pkState = null, pkList = null, pkRaise = 0, pkTick = null;
const PK_POS = [[50, 86], [11, 66], [11, 30], [50, 9], [89, 30], [89, 66]]; // Plätze um den Tisch, 0 = unten
const PK_C = [50, 47]; // Tischmitte
const lerp = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
let pkSeen = new Set(), pkHand = -1, pkPrev = null;
// Karte: nur neu ausgeteilte Karten bekommen die Austeil-Animation
const pkCard = (c, big, key) => {
  if (!c) return '';
  const fresh = key && !pkSeen.has(key); if (key) pkSeen.add(key);
  const cls = `pkc ${big ? 'big' : ''} ${fresh ? 'deal' : ''}`;
  return c.hidden ? `<span class="${cls} back"></span>` : `<span class="${cls} ${['♥', '♦'].includes(c.s) ? 'red' : ''}"><b>${esc(c.r)}</b><i>${esc(c.s)}</i></span>`;
};
// Chipstapel: mehr Chips für mehr Diamanten, Farbe nach Größe
// Chips nach Wert wie im echten Casino: jede Farbe eine Säule, mehr Geld = mehr und höhere Säulen
const CHIP_DEN = [[5000, '#E0A21E'], [1000, '#141414'], [500, '#8E4BD6'], [100, '#1F1F1F'], [25, '#1FA35A'], [5, '#D63A3A'], [1, '#E6E6E6']];
function chipPile(amount, big) {
  if (!amount) return '';
  let rest = amount; const cols = [];
  for (const [v, c] of CHIP_DEN) { const n = Math.floor(rest / v); if (n) { cols.push([c, n, v]); rest -= n * v; } }
  const show = cols.slice(0, big ? 5 : 3);
  return `<span class="pk-pile ${big ? 'big' : ''}">${show.map(([c, n, v]) => `<span class="pk-col" style="--h:${Math.min(big ? 12 : 8, n)}">${Array.from({ length: Math.min(big ? 12 : 8, n) }, (_, k) => `<i style="--c:${c};--k:${k}" class="${v === 1000 || v === 100 ? 'dk' : ''}"></i>`).join('')}</span>`).join('')}</span>`;
}

  const e = document.createElement('div'); e.className = 'pk-ann ' + (kind || ''); e.innerHTML = html;
  tb.appendChild(e); setTimeout(() => e.remove(), ms);
}

async function doSpin() {
  if (spinning) return;
  if (!rbets.length) return toast('Setz zuerst einen Chip auf das Tableau.');
  spinning = true;
  try {
    const d = await api('/api/casino/board', { bets: rbets.map((b) => ({ numbers: b.numbers, amount: b.amount })) });
    d.win = d.won > 0;
    lastBets = rbets.map((b) => ({ ...b })); rhist = d.history || rhist;
    showDia(((tcg && tcg.diamonds) || 0) - d.stake); // Einsatz ist weg, Gewinn kommt erst mit der Kugel
    const wheel = $('#wheel'), ball = $('#ballnum'), kugel = $('#ball');
    const deg = 360 * 6 + (360 - (d.index * (360 / 37)));
    wheel.style.transform = `rotate(${deg}deg)`;
    // Kugel kreist gegenläufig am Rand und fällt am Ende oben ins Fach unter dem Zeiger,
    // genau dort, wo das Rad die gezogene Zahl hindreht
    const track = $('#balltrack');
    if (track) {
      track.hidden = false; track.classList.remove('drop');
      track.style.transition = 'none'; track.style.transform = 'rotate(0deg)';
      void track.offsetWidth;
      track.style.transition = '';
      track.style.transform = 'rotate(-2880deg)';
      requestAnimationFrame(() => track.classList.add('drop'));
    }
    ball.textContent = '…'; ball.className = 'ballnum';
    sfx('dart');
    setTimeout(() => {
      ball.textContent = d.n; ball.className = 'ballnum ' + d.color;
      if (d.win) $('.wheelwrap').classList.add('winflash');
      setTimeout(() => $('.wheelwrap') && $('.wheelwrap').classList.remove('winflash'), 1300);
      rbets = []; syncDia(d.diamonds); // jetzt das echte Ergebnis
      casinoDone(d);
      showRouletteResult(d, lastBets);
      spinning = false;
    }, 4700);
  } catch (e) { spinning = false; toast(e.message); }
}

async function openPack(pid) {
  pid_last = pid;
  try {
    const r = await api('/api/tcg/open', { pack: pid });
    tcg = r.state; if (home) home.me.diamonds = r.state.diamonds;
    // Bilder erst laden, dann aufdecken: sonst dreht sich die Karte und das Bild ploppt danach nochmal auf
    await Promise.race([
      Promise.all(r.pulled.map((c) => new Promise((ok) => { const im = new Image(); im.onload = im.onerror = ok; im.src = cardImg(c.id, c.variant); }))),
      new Promise((ok) => setTimeout(ok, 2500)),

      const top = ['ultra', 'ext', 'legend', 'ghost'].includes(c.variant);
      sfx(top ? 'exact' : c.variant === 'holo' ? 'dartbest' : 'dart');

    }, i * 650 + 350));

    el.classList.add('on');

    const idx = r.pulled.findIndex((c) => c.variant === 'ghost') >= 0 ? r.pulled.findIndex((c) => c.variant === 'ghost') : r.pulled.findIndex((c) => c.variant === 'ext');

function showCard(key) {
  const [cid, v] = key.split(':');
  const c = cardDef(cid); if (!c) return;
  const n = owned(cid, v);
  const el = $('#cardview');
  el.innerHTML = `<div class="stage"><div class="tilt" id="tiltc"><img loading="lazy" src="${cardImg(cid, v)}" alt="">
      ${['holo', 'ultra', 'ext', 'legend'].includes(v) ? '<span class="sheen"></span><span class="rain"></span>' : ''}</div>
    <div class="meta"><b>${esc(c.name)}</b>${esc(varName(v))} · ${esc(c.theme)} · ${c.lvl} Sterne · ATK ${fmt(c.atk)} / DEF ${fmt(c.def)}

    <button class="btn ghost" id="closeCard" style="min-width:200px">Schließen</button></div>`;
  el.classList.add('on');
  const t = $('#tiltc');
  let tx = 0.5, ty = 0.5, cx = 0.5, cy = 0.5, raf = 0, drag = false;
  const draw = () => {
    cx += (tx - cx) * 0.22; cy += (ty - cy) * 0.22;
    const rx = (0.5 - cy) * 26, ry = (cx - 0.5) * 30;
    t.style.transform = `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) scale(${drag ? 1.04 : 1})`;
    t.style.setProperty('--sx', (cx * 100).toFixed(1) + '%');
    t.style.setProperty('--sy', (cy * 100).toFixed(1) + '%');
    if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001 || drag) raf = requestAnimationFrame(draw); else raf = 0;
  };
  const kick = () => { if (!raf) raf = requestAnimationFrame(draw); };
  const clamp01 = (v) => (Number.isFinite(v) ? Math.min(1, Math.max(0, v)) : 0.5);
  const at = (e) => { const r = t.getBoundingClientRect(); tx = clamp01((e.clientX - r.left) / r.width); ty = clamp01((e.clientY - r.top) / r.height); kick(); };
  t.addEventListener('pointerdown', (e) => { drag = true; t.classList.add('grab'); t.setPointerCapture(e.pointerId); at(e); e.preventDefault(); });
  t.addEventListener('pointermove', (e) => { if (drag || e.pointerType === 'mouse') at(e); });
  const stopDrag = () => { drag = false; t.classList.remove('grab'); tx = 0.5; ty = 0.5; kick(); };
  t.addEventListener('pointerup', stopDrag);
  t.addEventListener('pointercancel', stopDrag);
  t.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && !drag) stopDrag(); });
  const set = (px, py) => { tx = clamp01(px); ty = clamp01(py); kick(); };
  const gyro = (e) => { if (e.gamma == null) return; set(Math.min(1, Math.max(0, (e.gamma + 35) / 70)), Math.min(1, Math.max(0, (e.beta - 10) / 70))); };
  const startGyro = () => {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      DeviceOrientationEvent.requestPermission().then((r) => { if (r === 'granted') window.addEventListener('deviceorientation', gyro); }).catch(() => {});
    } else window.addEventListener('deviceorientation', gyro);
  };
  startGyro();
  showCard.stop = () => window.removeEventListener('deviceorientation', gyro);
}

function buildReveal() {
  const q = S.question, R = S.reveal, P = Object.fromEntries(S.players.map((p) => [p.id, p]));
  const head = `<div id="chips" class="chips mobonly"></div><div class="col"><div class="cat"><span>${esc(q.cat)}</span><span>Frage ${S.qIndex} von ${S.qTotal}</span></div><div class="qtext" style="font-size:20px">${esc(q.text)}</div>`;
  const foot = `<button class="link" id="report" style="align-self:center"></button><div class="deskonly" style="flex-direction:column;gap:10px;margin-top:8px"><h2>Punktestand</h2><div class="plist" id="sideboard2"></div></div></div>`;
  const footOnly = () => `<button class="link" id="report" style="align-self:center;margin-top:10px"></button></div>`;
  const me = (id) => (id === S.you ? ' me' : '');

  if (q.type === 'mc') {
    const rows = [...R.results].sort((a, b) => (b.right ? 1 : 0) - (a.right ? 1 : 0));
    const ok = R.results.filter((r) => r.right), mine = R.results.find((r) => r.id === S.you);
    return head + `
    <div class="mcsum ${mine ? (mine.right ? 'good' : 'bad') : ''}">
      <div class="big2">${mine ? (mine.right ? '✅ Richtig' : '❌ Falsch') : 'Nicht geantwortet'}</div>
      <div class="sub" style="margin-top:2px">${esc('ABCD'[R.correctIndex])} · ${esc(q.options[R.correctIndex])}</div>
      <div class="row" style="justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap">${ok.length
        ? ok.map((r) => `<span class="chip" style="--c:${P[r.id]?.color}">${avatar(P[r.id] || { name: '?' }, 20, false)}${esc(P[r.id]?.name || '?')}</span>`).join('')
        : '<span class="sub">Niemand lag richtig.</span>'}</div>
      <p class="sub" style="margin-top:8px">${ok.length} von ${R.results.length} richtig</p>
    </div>
    <div class="opts">${q.options.map((o, i) => { const who = R.results.filter((r) => r.value === i);
      return `<div class="opt ${i === R.correctIndex ? 'right' : 'wrong'}"><em>${'ABCD'[i]}</em>${esc(o)}<span class="who">${who.map((r) => `<i style="--c:${P[r.id]?.color}" title="${esc(P[r.id]?.name || '')}"></i>`).join('')}</span></div>`; }).join('')}</div></div><div class="col side">
      <div class="plist">${rows.map((r) => `<div class="res${me(r.id)}" data-pid="${r.id}" style="--c:${P[r.id]?.color}"><span class="mark">${r.value === null ? '⏳' : r.right ? '✅' : '❌'}</span>${avatar(P[r.id] || { name: '?' }, 34, false)}<span class="nm">${P[r.id] ? withTag(P[r.id]) : '?'}${r.id === S.you ? ' <small>(du)</small>' : ''}<br><span class="diff">${r.value === null ? 'keine Antwort' : 'ABCD'[r.value] + ' · ' + esc(q.options[r.value])}</span></span><span class="pts ${r.points ? '' : 'zero'}">+${r.points}</span></div>`).join('')}</div>` + foot;
  }

  const given = R.results.filter((r) => r.value !== null);
  const U = R.unit === 'Jahr' ? '' : ' ' + R.unit;
  const diffText = (r) => r.value === null ? 'keine Schätzung' : r.exact ? 'genau richtig' : `${fmt(Math.abs(r.value - R.answer), R.unit)}${U} ${r.value > R.answer ? 'zu hoch' : 'zu niedrig'}`;
  // Treffergenauigkeit als Balken: 100 % = exakt
  const worstDev = Math.max(...given.map((r) => Math.abs(r.value - R.answer)), 1e-9);
  const acc = (r) => (r.value === null ? 0 : Math.round(100 * (1 - Math.abs(r.value - R.answer) / (worstDev * 1.15))));
  const rows = [...R.results];
  const medal = ['🥇', '🥈', '🥉'];
  const steps = rows.length;
  return head + `
    <div class="answer" style="--d:.1s"><p class="sub">Richtig ist</p><div class="num">${fmt(R.answer, R.unit)} <small>${esc(R.unit === 'Jahr' ? '' : R.unit)}</small></div></div>
    <div class="stairs">${rows.map((r, i2) => {
      const p2 = P[r.id] || { name: '?' };
      const d = ((steps - 1 - i2) * 0.35).toFixed(2) + 's';
      return `<div class="step ${r.id === S.you ? 'me' : ''} ${i2 === 0 && r.value !== null ? 'first' : ''}" style="--c:${p2.color || 'var(--line)'};--d:${d};--in:${Math.min(i2, 4) * 8}px">
        <span class="rk">${r.value === null ? '–' : (medal[i2] || i2 + 1)}</span>
        ${avatar(p2, 40)}
        <span class="nm"><span class="ln1"><span class="who">${withTag(p2)}</span>${r.id === S.you ? '<small>(du)</small>' : ''}${r.exact ? '<span class="tag hit">×3</span>' : r.close ? '<span class="tag">×2</span>' : ''}</span>
          <span class="bar"><i style="width:${Math.max(0, acc(r))}%"></i></span>
          <span class="diff">${diffText(r)}</span></span>
        <span class="val">${r.value === null ? '–' : fmt(r.value, R.unit)}</span>
        <span class="pts ${r.points ? '' : 'zero'}">+${r.points}</span></div>`; }).join('')}</div>
    ${given.length ? `<div class="winbox" style="animation-delay:${((steps - 1) * 0.35 + 0.25).toFixed(2)}s"><img class="frame" src="/emblems/winbanner.webp?v=${AVER}" alt="">
      <div class="in">${avatar(P[rows[0].id] || { name: '?' }, 38)}<b>${esc(P[rows[0].id]?.name || '?')}</b><span class="pts">+${rows[0].points}</span></div>
      ${rows[0].exact ? `<img class="bulls" src="/emblems/bullseye.webp?v=${AVER}" alt="">` : ''}</div>` : ''}
    </div><div class="col side deskonly"><h2>Punktestand</h2><div class="plist" id="sideboard"></div></div>` + footOnly();
}

const isFriend = (id) => friends.some((f) => f.id === id);
function addBtn(p) { return p.id === S.you || isFriend(p.id) ? '' : `<button class="mini" data-addfriend="${esc(p.name)}">+ Freund</button>`; }
function sideHtml() {

function friendsHtml() {
  if (!friends.length) return '<p class="sub">Noch keine Freunde. Füge jemanden per Spielername hinzu oder tippe nach einem Match auf „+ Freund“.</p>';
  const row = (f) => `<div class="pl" style="--c:${f.status === 'in' ? 'var(--tape)' : 'var(--line)'}" ${f.status === 'ok' ? `data-user="${f.id}"` : ''}>${avatar(f, 38)}<span class="nm">${withTag(f)}<br><span class="lv">${f.status === 'in' ? 'möchte dein Freund sein' : f.status === 'out' ? 'Anfrage gesendet' : rankText(f) + ' · ' + (f.playing ? onlineText(f) : onlineText(f))}</span></span>${f.status === 'in' ? `<button class="mini go" data-fr="accept" data-id="${f.id}">Annehmen</button><button class="mini" data-fr="decline" data-id="${f.id}">Nein</button>` : f.status === 'out' ? `<button class="mini" data-fr="remove" data-id="${f.id}">Zurückziehen</button>` : (f.joinCode ? `<button class="mini go" data-join="${esc(f.joinCode)}">Beitreten</button>` : f.watchCode ? `<button class="mini" data-watch="${esc(f.watchCode)}">Zuschauen</button>` : '') + `<span class="fr-dot ${f.playing ? 'play' : f.online ? 'on' : ''}"></span>`}</div>`;
  const order = { in: 0, ok: 1, out: 2 };
  const sorted = [...friends].sort((a, b) => order[a.status] - order[b.status] || b.online - a.online || a.name.localeCompare(b.name));
  // Anfragen und Online-Freunde direkt, Offline-Freunde zum Aufklappen
  const top = sorted.filter((f) => f.status !== 'ok' || f.online);
  const off = sorted.filter((f) => f.status === 'ok' && !f.online);
  return top.map(row).join('')
    + (off.length ? `<details class="fold offfold" ${openFold === 'off' ? 'open' : ''} data-fold="off"><summary><span class="grow">Offline</span><span class="sub">${off.length}</span></summary><div class="plist" style="margin-top:8px">${off.map(row).join('')}</div></details>` : '')
    + (!top.length && off.length ? '' : '');
}

function showInvite() {
  const inMatch = S ? S.players.map((p) => p.id) : [];
  const list = friends.filter((f) => f.status === 'ok' && !f.playing && !inMatch.includes(f.id))
