  if (t.dataset.addfriend) return api('/api/friends/add', { name: t.dataset.addfriend }).then((r) => { toast(r.status === 'ok' ? r.name + ' ist jetzt dein Freund' : 'Anfrage an ' + r.name + ' gesendet'); t.remove(); loadFriends(); }).catch((er) => toast(er.message));
  if (t.dataset.fr) return api('/api/friends/' + t.dataset.fr, { id: Number(t.dataset.id) }).then(() => { closeModal(); loadFriends(); }).catch((er) => toast(er.message));
  if (t.dataset.tab) { authTab = t.dataset.tab; render(); }
  else if (t.dataset.bet !== undefined) { socket.emit('bet', Number(t.dataset.bet)); setTimeout(loadHome, 700); setTimeout(loadHome, 1600); }
  else if (t.dataset.watch) socket.emit('watch', t.dataset.watch);
  else if (t.dataset.join) socket.emit('join', t.dataset.join);
  else if (t.dataset.set) socket.emit('settings', { [t.dataset.set]: Number(t.dataset.v) });
  else if (t.dataset.mode) socket.emit('settings', { ranked: t.dataset.mode === 'ranked' });
  else if (t.dataset.theme) {
    if (!themeSel) themeSel = [...S.themes];
    if (t.dataset.theme === 'grace') { themeSel = ['grace']; return socket.emit('settings', { themes: ['grace'] }); }
    if (themeSel.includes('grace')) themeSel = [];
    const has = themeSel.includes(t.dataset.theme);
    if (!has && themeSel.length >= S.maxThemes) return toast(`Höchstens ${S.maxThemes} Themen.`);
    if (has && themeSel.length === 1) return toast('Mindestens ein Thema muss aktiv bleiben.');
    if (!has && themeSel.length === 0) { themeSel = [t.dataset.theme]; return socket.emit('settings', { themes: themeSel }); }
    themeSel = has ? themeSel.filter((x) => x !== t.dataset.theme) : [...themeSel, t.dataset.theme];
    t.classList.toggle('on', !has);
    socket.emit('settings', { themes: themeSel });
  }
  else if (t.dataset.i !== undefined && S && S.phase === 'question') socket.emit('answer', Number(t.dataset.i));
  else if (['create', 'start', 'skip', 'again', 'report'].includes(t.id)) { if (t.id === 'create') soloIntent = false; socket.emit(t.id); }
  else if (t.id === 'createDone') socket.emit(soloIntent ? 'create_solo' : 'create_done');
  else if (t.id === 'createSolo') { soloIntent = true; socket.emit('create'); setTimeout(() => socket.emit('settings', { ranked: false }), 400); }
  else if (t.id === 'leave' || t.id === 'quit') {
    const midGame = S.phase === 'question' || S.phase === 'reveal';
    if (!midGame || confirm('Match wirklich verlassen? Du bekommst für dieses Match keine XP und keine Weltranglistenpunkte.')) socket.emit('leave');
  }
  else if (t.id === 'logout') logout();
  else if (t.id === 'mute' || t.id === 'sound') { muted = !muted; try { localStorage.setItem('sz_mute', muted ? '1' : '0'); } catch (e2) {} update(); if (!muted) sfx('sent'); }
  else if (t.dataset.board) { boardMode = t.dataset.board; update(); }
  else if (t.dataset.fight) {
    socket.emit('challenge', Number(t.dataset.fight));
    if (t.classList.contains('mini')) { t.textContent = 'gesendet ✓'; t.disabled = true; t.classList.add('sent'); }
    else toast('Einladung wird verschickt …');
  }
  else if (t.id === 'invite') showInvite();
  else if (t.id === 'pushOn') pushOn();
  else if (t.id === 'pushOff') pushOff();
  else if (t.id === 'newTrade') tradeDialog();
  else if (t.id === 'openCasino') { page = 'casino'; ctab = 'casino'; vipD = null; render(); loadTcg(); loadVip(); }
  else if (t.id === 'openNews' || t.closest('#openNews')) { page = 'news'; render(); }
  else if (t.id === 'openRanks') { page = 'ranks'; render(); }
  else if (t.id === 'openChallenges') { page = 'challenges'; render(); }
  else if (t.id === 'openAdmin') { page = 'admin'; render(); }
  else if (t.id === 'openSupport') { page = 'support'; render(); }
  else if (t.dataset.rt) { rtab = t.dataset.rt; renderRanks(); }
  else if (t.id === 'openDaily') dailyDialog();
  else if (t.id === 'openCards') { page = 'cards'; ctab = 'sammlung'; render(); loadTcg(); }
  else if (t.dataset.ct) { ctab = t.dataset.ct; market = null; trades = null; renderCards(); if (ctab === 'boerse') loadMarket(); if (ctab === 'tausch') loadTrades(); }
  else if (t.dataset.pack) packInfo(t.dataset.pack);
  else if (t.dataset.buy) api('/api/tcg/buy', { pack: t.dataset.buy, n: 1 }).then((st) => { tcg = st; if (home) home.me.diamonds = st.diamonds; renderCards(); toast('Booster gekauft'); }).catch((e) => toast(e.message));
  else if (t.dataset.open) openPack(t.dataset.open);
  else if (t.dataset.sell) sellCard(t.dataset.sell);
  else if (t.dataset.mbuy) api('/api/tcg/market/buy', { id: t.dataset.mbuy }).then((st) => { tcg = st; if (home) home.me.diamonds = st.diamonds; loadMarket(); toast('Gekauft'); }).catch((e) => toast(e.message));
  else if (t.dataset.mcancel) api('/api/tcg/cancel', { id: t.dataset.mcancel }).then((st) => { tcg = st; loadMarket(); }).catch((e) => toast(e.message));
  else if (t.dataset.tacc) api('/api/tcg/trade/accept', { id: t.dataset.tacc }).then(() => { loadTrades(); loadTcg(); toast('Getauscht'); }).catch((e) => toast(e.message));
  else if (t.dataset.tdec) api('/api/tcg/trade/decline', { id: t.dataset.tdec }).then(() => loadTrades()).catch((e) => toast(e.message));
  else if (t.dataset.card) showCard(t.dataset.card);
  else if (t.dataset.addfr) {
    e.stopPropagation();
    api('/api/friends/add', { id: Number(t.dataset.addfr) }).then((r) => {
      toast(r.status === 'ok' ? `Ihr seid jetzt befreundet: ${r.name}` : `Anfrage an ${r.name} gesendet`);
      t.outerHTML = '<span class="sub">angefragt</span>';
      loadFriends && loadFriends();
    }).catch((er) => toast(er.message));
  }
  else if (t.dataset.copycode) { try { navigator.clipboard.writeText(t.dataset.copycode); toast('Code kopiert: ' + t.dataset.copycode); } catch (er) { toast(t.dataset.copycode); } }
  else if (t.dataset.qsrc) {
    api('/api/admin/qsource', { source: t.dataset.qsrc }).then((r) => { home.me.qsource = r.source; if (adminD) { adminD.source = r.source; renderAdmin(); } document.querySelectorAll('[data-qsrc]').forEach((b) => b.classList.toggle('on', b.dataset.qsrc === r.source)); toast(r.source === 'pool' ? 'Fragenquelle: Pool' : 'Fragenquelle: Live'); }).catch((er) => toast(er.message));
  }
  else if (t.dataset.cg) { cgame = t.dataset.cg; bj = null; renderCards(); reportPresence(); if (cgame === 'vip') loadVip(); }
  else if (t.dataset.cbet) { cbetPick = t.dataset.cbet; document.querySelectorAll('[data-cbet]').forEach((x) => x.classList.toggle('picked', x === t)); cbet = t.dataset.cbet === 'all' ? Math.max(50, Math.min(MAX_CBET, (tcg && tcg.diamonds) || 0)) : Number(t.dataset.cbet); const el = $('#cbAmount'); if (el) el.value = cbet; if (t.dataset.cbet === 'all') toast(`All in: ${fmt(cbet)} Diamanten`); }
  else if (t.id === 'spinBtn') doSpin();
  else if (t.id === 'bjDeal') bjAction('deal');
  else if (t.dataset.pick) { cpick = t.dataset.pick; renderCasino(); }
  else if (t.dataset.cf) { cfilter = t.dataset.cf; renderCards(); }
  else if (t.id === 'stopWatch') socket.emit('unwatch');
  else if (t.id === 'closeCard') { $('#cardview').classList.remove('on'); if (showCard.stop) showCard.stop(); }
  else if (t.id === 'openNext') openPack(pid_last);
  else if (t.id === 'closeOpener') { $('#opener').classList.remove('on'); loadTcg(); }
  else if (t.id === 'openProfile') { page = 'profile'; render(); }
  else if (t.id === 'back') { freshKeep = new Set(); page = 'home'; render(); }
  else if (t.id === 'avaBtn') $('#avaFile').click();
  else if (t.dataset.frame !== undefined) {
    if (t.classList.contains('lock')) return showLocked('frame', t.dataset.frame);
    api('/api/frame', { frame: t.dataset.frame }).then(async () => { await loadHome(); viewKey = ''; render(); }).catch((e) => toast(e.message));
  }
  else if (t.dataset.emb !== undefined || t.dataset.title !== undefined) {
    if (t.classList.contains('lock')) return showLocked(t.dataset.emb !== undefined ? 'emblem' : 'title', t.dataset.emb !== undefined ? t.dataset.emb : t.dataset.title);
    const me = home.me, cur = t.dataset.emb !== undefined ? me.emblem : (me.title || '');
    const val = (t.dataset.emb !== undefined ? t.dataset.emb : t.dataset.title) === cur ? '' : (t.dataset.emb !== undefined ? t.dataset.emb : t.dataset.title);
    const body = t.dataset.emb !== undefined ? { emblem: val, title: me.title || '' } : { emblem: me.emblem || '', title: val };
    api('/api/card', body).then(async () => { await loadHome(); viewKey = ''; render(); }).catch((e) => toast(e.message));
  }
  else if (t.id === 'cardClear') api('/api/card', { emblem: '', title: '' }).then(async () => { await loadHome(); viewKey = ''; render(); }).catch((e) => toast(e.message));
  else if (t.dataset.color) { tagColor = t.dataset.color; document.querySelectorAll('[data-color]').forEach((b) => b.classList.toggle('on', b === t)); $('#tagIn').dispatchEvent(new Event('input')); }
  else if (t.id === 'quickOn') socket.emit('settings', { answerTime: 8 });
  else if (t.id === 'quickOff') socket.emit('settings', { answerTime: 30 });
  else if (t.id === 'waitOn') socket.emit('settings', { waitAi: true });
  else if (t.id === 'waitOff') socket.emit('settings', { waitAi: false });
  else if (t.id === 'accPub') { privMode = false; socket.emit('settings', { password: '' }); }
  else if (t.id === 'accPriv') { privMode = true; update(); $('#pwInput').focus(); }
  else if (t.id === 'doPrestige') { if (confirm('Prestige aktivieren? Level und XP starten wieder bei 1.')) api('/api/prestige', {}).then(async (r) => { await loadHome(); showUnlock(r.prestige, home.progress.names[r.prestige]); }).catch((e) => toast(e.message)); }
  else if (t.id === 'share') { const url = location.origin + '/?join=' + S.code; (navigator.share ? navigator.share({ title: 'Schätzspiel', text: 'Spiel mit! Code ' + S.code, url }) : navigator.clipboard.writeText(url).then(() => toast('Link kopiert'))).catch(() => {}); }
});

// ---------- Maßband-Timer ----------
function tick() {
  if (S && S.phase === 'countdown' && !S.endsAt) { const b = $('#bigSec'); if (b) b.textContent = '…'; const l = $('#cdLabel'); if (l) l.textContent = 'Fragen werden fertig gemacht'; }
  const tape = $('#tape'), on = S && S.endsAt && S.phase !== 'finished' && S.phase !== 'lobby';
  tape.classList.toggle('on', !!on);
  if (on) {
    const left = Math.max(0, S.endsAt - (Date.now() + offset)), sec = Math.ceil(left / 1000);
    $('#tapeBand').style.width = Math.max(0, Math.min(100, 100 * left / (S.totalMs || 1))) + '%';
    $('#tapeSec').textContent = S.phase === 'reveal' ? '' : sec;
    tape.classList.toggle('low', S.phase === 'question' && sec <= 5);
    if (S.phase === 'question' && sec <= 5 && sec > 0 && tick.last !== S.qIndex + ':' + sec) { tick.last = S.qIndex + ':' + sec; if (S.myAnswer === null) sfx('tick'); }
    const big = $('#bigSec'); if (big) big.textContent = sec;
  }
  // Nur während eines laufenden Countdowns flüssig aktualisieren, sonst selten nachsehen
  if (on || (S && S.phase === 'countdown')) requestAnimationFrame(tick); else setTimeout(tick, 400);
}

let wake = null;
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible') { if (socket && !socket.connected) socket.connect(); try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {} } });
// Beim Laden darf kein Feld den Fokus haben, sonst springt die Tastatur auf
window.addEventListener('pageshow', () => { const a = document.activeElement; if (a && /INPUT|TEXTAREA/.test(a.tagName)) a.blur(); });
setTimeout(() => { const a = document.activeElement; if (a && /INPUT|TEXTAREA/.test(a.tagName)) a.blur(); }, 0);
fetch('/api/config').then((r) => r.json()).then((c) => { if (c.needCode !== needCode) { needCode = c.needCode; if (!token) { viewKey = ''; render(); } } }).catch(() => {});
// Beitritt über den Link aus der Push-Nachricht
const bjq = new URLSearchParams(location.search).get('bj');
if (bjq && token) setTimeout(() => { page = 'casino'; ctab = 'casino'; cgame = 'tables'; render(); loadTcg(); if (socket) socket.emit('bj:join', bjq); history.replaceState(null, '', '/'); }, 1800);
render(); tick();
if (token) { loadHome(); connect(); pushInit(); }
</script>
